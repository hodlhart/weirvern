{% extends "base.html" %}
{% block title %}Sign in - Weirvern{% endblock %}
{% block body %}
  <div class="auth-lockup">
    <img src="/logo-full.png" alt="Weirvern" width="148" height="145">
  </div>
  <h1>Sign in</h1>
  <p class="lede">{{ accounts_note or "Use the account created for this deployment." }}</p>

  <div class="card">
    {% if error %}
      <p class="bad" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ url_for("login") }}">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus
             value="{{ username or "" }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>

  {% if can_register %}
    <p class="note">No account yet? <a href="{{ url_for("register") }}">Register one</a>.</p>
  {% endif %}
{% endblock %}
