[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weirvern"
version = "0.19.14"
description = "Home-lab network flow anomaly detection: GoFlow2 -> ClickHouse -> scikit-learn ensemble -> Pushover"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Samuel Hart" }]
dependencies = [
    "clickhouse-connect>=0.8.0,<1.0",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    # Certificate signing for the mTLS weirling gateway. It was deliberately not a
    # dependency of the read-only console; the gateway needs CSR parsing and signing.
    "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    # PINNED EXACTLY, not a range. `ruff>=0.6,<1` let CI resolve a newer ruff than the one used
    # locally, and the two disagreed: F601 (duplicate dictionary key) fires in ruff 0.16 but the
    # rule was not reported by the version a developer here was running. The result was a green
    # local `ruff check` and a RED CI on the same commit -- the worst combination, because the
    # failure appears after the push rather than before it.
    #
    # A linter is a build tool: its version is part of the build, so it is pinned like any other.
    "ruff==0.16.7",
    "mypy>=1.10,<2",
]

[project.scripts]
weirvern = "weirvern.admin.cli:main"

[tool.setuptools.packages.find]
include = ["weirvern*"]

[tool.setuptools.package-data]
# The ClickHouse schema must ship INSIDE the wheel: it is applied by
# `weirvern init-db`, which runs from the container image (see
# k8s/50-schema-job.yaml). Declaring it here is what makes that work; without
# this line the .sql file is absent from an installed package and the schema
# step silently does nothing.
weirvern = ["schema/*.sql", "admin/web/*"]
# The web GUI's assets must ship inside the wheel for the same class of reason:
# the GUI Server reads them at request time from weirvern/admin/web. Without this
# the page returns a 500 naming the missing file (the handler is explicit about
# it rather than serving an empty 200), which is the schema bug's shape again --
# works in a checkout, breaks in an installed package.
"weirvern.admin" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# THE CHECKER'S TARGET IS DECLARED, not inherited from whichever interpreter runs the venv.
# mypy defaults to the RUNNING interpreter's version, so one command and one mypy version gave
# different verdicts on different machines (measured: three errors at a 3.14 target on a tree
# CI accepts at 3.12 -- and a local gate that refuses a push CI would accept is a gate people
# learn to ignore). This value matches the CI matrix's upper bound; gate.sh and ci.yml both
# invoke mypy from the repository root, so both read the target from this one place.
python_version = "3.12"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
