[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weirvern"
version = "0.4.0"
description = "Home-lab network flow anomaly detection: GoFlow2 -> ClickHouse -> scikit-learn ensemble -> Pushover"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Samuel Hart" }]
dependencies = [
    "clickhouse-connect>=0.8.0,<1.0",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
admin = [
    "textual>=1.0,<2",
    "rich>=14,<16",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
weirvern = "weirvern.admin.cli:main"

[tool.setuptools.packages.find]
include = ["weirvern*"]

[tool.setuptools.package-data]
# The ClickHouse schema must ship INSIDE the wheel: it is applied by
# `weirvern init-db`, which runs from the container image (see
# k8s/50-schema-job.yaml). Declaring it here is what makes that work; without
# this line the .sql file is absent from an installed package and the schema
# step silently does nothing.
weirvern = ["schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
