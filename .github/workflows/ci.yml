name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check weirvern tests scripts
      - name: Installer interface logic (simulated machines)
        # bash, not sh: the script's shebang names bash (gate.sh calls it the same way), and
        # dash rejects its `set -o pipefail` before the first assertion runs.
        run: bash scripts/verify_installer.sh
      - name: Shell syntax (every script, its own shebang)
        run: |
          rc=0
          for f in scripts/*.sh install.sh; do
            [ -e "$f" ] || continue
            case "$(head -1 "$f")" in
              *bash*) checker=bash ;;
              *) checker=sh ;;
            esac
            if ! "$checker" -n "$f"; then echo "::error file=$f::does not parse under $checker"; rc=1; fi
          done
          exit $rc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the DOM harness dependency (jsdom)
        run: npm ci
      - name: GUI DOM harness (executes the shipping JavaScript)
        run: node scripts/jsdom_render.js
      - name: Type check
        run: mypy weirvern --ignore-missing-imports
      - name: Test
        run: pytest

  # DETECTION QUALITY, MEASURED. The suite above proves components; this job proves
  # OUTCOMES -- a seeded port scan, beacon and exfil spike must reach final verdicts
  # through the real aggregation (materialized views), the real training and the real
  # sweep. ML-1: detection quality was never measured, and an arity bug that stopped
  # ALL detection shipped past 1000+ component tests. This job is the gap closed.
  detection-quality:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Seeded-attack detection eval
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: "8123"
          MODEL_DIR: /tmp/models
        run: python scripts/eval_detection.py --minutes 300 --devices 12

  # The manifests are a deployment artifact, so validate them like one: schema
  # correctness AND assembly. kustomize build catches a class of error that
  # per-file validation cannot — a reference to a ConfigMap or volume that no
  # manifest declares only appears once everything is assembled.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        # PINNED, WITH A CHECKSUM (HD-22). It used to install whatever `releases/latest`
        # published, so the validator that gates every manifest change was unpinned and
        # unverified. Bump KUBECONFORM_VERSION deliberately.
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSfL "$base/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tgz
          curl -sSfL "$base/CHECKSUMS" -o /tmp/kubeconform.CHECKSUMS
          (cd /tmp && grep ' kubeconform-linux-amd64.tar.gz$' kubeconform.CHECKSUMS | sha256sum -c -)
          tar xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/
          kubeconform -v

      - name: Install kustomize
        # ONE VERSION, ONE PLACE: install.sh ships the renderer operators use, so CI reads its
        # pin rather than keeping a second number in a second file. The old v5.5.0 here and
        # v5.7.1 there meant two renderers validating the same manifests.
        run: |
          KUSTOMIZE_VERSION="$(sed -n 's/^KUSTOMIZE_VERSION="\(.*\)"/\1/p' install.sh)"
          [ -n "$KUSTOMIZE_VERSION" ] || { echo "install.sh has no KUSTOMIZE_VERSION pin"; exit 1; }
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Validate manifests against Kubernetes schemas
        run: |
          kubeconform -strict -summary -ignore-missing-schemas k8s/
          for f in k8s/units/*.template; do
            # The unit templates are YAML documents with placeholders, not manifests; a
            # placeholder is expected to fail schema validation, so they are parsed, not
            # schema-checked.
            python -c "import yaml,sys; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"
          done

      - name: Assemble the manifests
        # EVERY overlay is rendered, not just k8s/. `overlays/siphon` has its own
        # kustomization and used to be found broken by hand, after the fact.
        run: |
          kustomize build k8s/ > /tmp/rendered.yaml
          for d in overlays/*/; do
            if [ -f "$d/kustomization.yaml" ]; then
              echo "rendering $d"
              kustomize build "$d" > "/tmp/render-$(basename "$d").yaml"
            fi
          done

      - name: Verify the schema ships inside the package
        run: |
          # The schema Job runs `weirvern init-db` from the built image, so the
          # .sql file must be present in an INSTALLED (non-editable) package.
          # This caught a real bug: it used to resolve outside the package, so the
          # Job applied nothing and reported success.
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q .
          /tmp/venv/bin/python - <<'PY'
          from weirvern import db
          files = sorted(db.SCHEMA_DIR.glob("*.sql"))
          assert files, f"schema missing from installed package: {db.SCHEMA_DIR}"
          text = files[0].read_text()
          assert "CREATE TABLE" in text, "schema file looks empty"
          print(f"schema present in installed package: {[p.name for p in files]}")
          PY

      - name: Check rendered references resolve
        run: |
          # Every ConfigMap/volume the rendered output points at must exist, or
          # the pod is rejected at admission time on a real cluster.
          #
          # Secret EXCEPTION: Weirvern's Secret is deliberately NOT part of the
          # kustomization — a committed Secret manifest would overwrite real
          # credentials with placeholders on every apply (see the SECRETS note in
          # k8s/kustomization.yaml). It is created out of band by the operator, so
          # its absence from the render is correct. Secret references are checked
          # for NAME CONSISTENCY instead, which is the part that can actually go
          # wrong: three manifests must all reference the same Secret name.
          pip install -q pyyaml
          python - <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          cms = {d["metadata"]["name"] for d in docs if d.get("kind") == "ConfigMap"}
          pvcs = {d["metadata"]["name"] for d in docs if d.get("kind") == "PersistentVolumeClaim"}

          def refs(o):
              """Every ConfigMap/Secret reference, in ALL the shapes Kubernetes allows.

              ── WHY configMapKeyRef WAS THE GAP THAT MATTERED ────────────────────────────────
              MEASURED (2026-09-23, mutation-tested): this function matched `configMap`,
              `configMapRef`, `secretRef` and `secretKeyRef` -- but NOT `configMapKeyRef`. It
              checked 1 secretKeyRef in the tree while 7 configMapKeyRefs went unexamined, and
              mutating one of those to a name that does not exist produced `problems: NONE`, so
              CI passed a manifest that could not start. The pod would fail with
              CreateContainerConfigError at deploy time, on the operator's cluster, with the
              check that exists to catch it reporting green.

              A reference is a reference whatever its shape: `name` is the field that must
              resolve, and leaving one variant out is how a checker becomes decorative. Both
              `configMap*` and `secret*` variants are now matched by prefix rather than by an
              enumerated list, so a shape nobody thought of is caught too.
              """
              if isinstance(o, dict):
                  for k, v in o.items():
                      if isinstance(v, dict) and "name" in v:
                          if k.startswith("configMap"):
                              yield ("configmap", v["name"])
                          elif k.startswith("secret"):
                              yield ("secret", v["name"])
                      yield from refs(v)
              elif isinstance(o, list):
                  for i in o:
                      yield from refs(i)

          problems, secret_names = [], set()
          for d in docs:
              kind, name = d.get("kind"), d.get("metadata", {}).get("name")
              spec = d.get("spec", {})
              tmpl = spec.get("template", {}).get("spec", {}) if spec.get("template") else spec
              if not tmpl:
                  continue
              for rtype, ref in refs(d):
                  if rtype == "configmap" and ref not in cms:
                      problems.append(f"{kind}/{name}: unresolved ConfigMap {ref}")
                  if rtype == "secret":
                      secret_names.add(ref)
              declared = {v["name"] for v in tmpl.get("volumes") or [] if "name" in v}
              for vct in spec.get("volumeClaimTemplates") or []:
                  declared.add(vct["metadata"]["name"])
              for c in list(tmpl.get("containers") or []) + list(tmpl.get("initContainers") or []):
                  for m in c.get("volumeMounts") or []:
                      if m["name"] not in declared:
                          problems.append(f"{kind}/{name}: mount {m['name']} has no volume")
              for v in tmpl.get("volumes") or []:
                  pvc = v.get("persistentVolumeClaim")
                  if pvc and pvc["claimName"] not in pvcs:
                      problems.append(f"{kind}/{name}: PVC {pvc['claimName']} not declared")

          # Consistency: exactly one Secret name must be referenced everywhere.
          if len(secret_names) != 1:
              problems.append(
                  f"manifests reference {len(secret_names)} different Secret names "
                  f"{sorted(secret_names)}; the operator creates exactly one"
              )
          # And it must match what the docs tell the operator to create.
          readme = open("README.md").read()
          only = next(iter(secret_names), None)
          if only and f"generic {only}" not in readme:
              problems.append(
                  f"README does not tell the operator to create Secret '{only}'"
              )

          if problems:
              print("Manifest reference problems:")
              for p in problems:
                  print(" ", p)
              sys.exit(1)
          print(f"references resolve across {len(docs)} resources; secret '{only}' consistent")
          PY
