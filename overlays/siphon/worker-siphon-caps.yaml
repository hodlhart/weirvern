# The worker's capabilities for siphon mode, and why they are separate from the sensor's.
#
# THE WORKER IS WHAT RUNS THE INTERCEPT. `weirvern intercept` is a CLI/control-plane command,
# so it executes in the worker pod, not in the zeek pod. The sensor only *captures* in siphon
# mode; the worker forges the ARP announcements, installs the policy route, and drives the
# watchdog. So the capabilities have to be here, and the sensor's NET_ADMIN alone does not
# help it.
#
# WHAT IT NEEDS, and what each is for:
#
#   NET_RAW    to send the forged ARP announcement frames. Without it the intercept reports
#              "intercepting N hosts" and forges nothing -- the exact silent no-op that the
#              frame-type bug produced earlier, but harder to notice because the error is
#              EPERM at socket creation rather than a quiet misbehaviour.
#   NET_ADMIN  to assign the capture address, install the table-100 policy route, and set the
#              forwarding sysctls.
#
# WHY BOTH, NOT JUST NET_ADMIN: NET_ADMIN does not imply the ability to open an AF_PACKET
# socket. They are independent grants, and the intercept needs one of each.
#
# WHY THE WORKER AND NOT JUST THE ZEEK POD: the sensor's job is to observe traffic; the
# control plane's job is to change the network. Keeping those in different pods means the
# process that parses untrusted packet data is not the process holding the ability to reroute
# the segment. The zeek pod keeps NET_RAW for capture and gains NET_ADMIN only for the
# sysctls; the worker gets both because it performs the intercept.
#
# These are granted ONLY in the siphon overlay. The default `loch` deployment leaves the worker
# with no capabilities at all, because passive monitoring does not need them -- verified: the
# base worker manifest drops ALL and adds nothing.
#
# ── WHY `runAsUser: 0` IS REQUIRED, AND NOT AN OVERSIGHT ──────────────────────────────────
#
# Kubernetes DROPS added capabilities for a non-root container. The first version of this patch
# added NET_RAW and NET_ADMIN without changing the user, and the result was measured inside the
# running pod:
#
#     CapBnd: 0000000000003000     <- bits 12,13 = NET_ADMIN, NET_RAW: in the bounding set
#     CapEff: 0000000000000000     <- ...and NOT effective. The add did nothing.
#
# So `add:` alone silently grants nothing when runAsUser is 10001, which is the worker's
# default. The capabilities are present in the bounding set, so `capsh --print` style checks
# that only look at CapBnd will report success while every real operation fails with EPERM.
#
# This is the same constraint already documented in k8s/32-zeek.yaml for the sensor, and it is
# why the zeek container is root there despite being a network-facing parser.
#
# The trade is deliberate and scoped: siphon mode is the mode that reroutes a live segment, it is
# opt-in, and it is documented as requiring more privilege than loch. The default deployment is
# unaffected.
# ── WHY THE WORKER NEEDS hostNetwork, WHICH IS A REAL PRIVILEGE WIDENING ──────────────────
#
# `weirvern intercept` runs HERE, not in the sensor pod, so the worker needs the capture NIC.
# Measured: without hostNetwork the worker sees exactly ['lo', 'eth0'] while the node has eth1,
# so the intercept cannot reach the interface it is supposed to poison and relay on. The
# sensor sees eth1 only because it already runs with hostNetwork: true.
#
# THE COST, stated rather than glossed: hostNetwork removes the pod network namespace. The
# worker's DNS, and anything else it binds, is the node's. That is acceptable because the
# worker has no HTTP server and no Service:
#
#   * it runs no listener and exposes no port, so there is nothing to collide on
#   * it reaches ClickHouse through a normal ClusterIP Service, which hostNetwork pods still
#     resolve (the node's resolv.conf points at CoreDNS via kube-dns, and the node runs the
#     kubelet's DNS setup) -- VERIFIED after the change, see the note below
#   * its probes are exec-based (`python -c "import weirvern.config"`), not HTTP, so they are
#     unaffected by leaving the pod network
#   * dnsPolicy is set explicitly to ClusterFirstWithHostNet, because the Kubernetes default
#     for a hostNetwork pod is `Default`, which resolves through the NODE's resolver and would
#     NOT resolve `clickhouse.weirvern.svc.cluster.local`. That is a real failure mode and the
#     one line that prevents it.
#
# These are granted ONLY in the siphon overlay. The default `loch` deployment keeps the worker in
# its own network namespace, where a compromise cannot see the host's interfaces at all.
#
# ── REMOVING THIS OVERLAY CAN ORPHAN AN NFT TABLE ON THE NODE ─────────────────────────────
#
# MEASURED, and worth knowing before downgrading. With the overlay applied, the Sluice Gate
# installs `table inet weirvern_sluice` in the NODE's kernel (the worker shares the node's network
# namespace, so that is unavoidable and intended). Removing the overlay takes away hostNetwork and
# NET_ADMIN, so `choose_backend("nft")` starts answering unavailable -- and the table stays,
# because the process that wrote it can no longer reach the kernel to delete it.
#
# The orphan is INERT: the chain policy is `accept` and both sets are empty, with counters at
# 0 packets / 0 bytes. It drops nothing -- verified with the full ruleset in hand and the node
# forwarding normally. It is untidy rather than dangerous, but an operator who downgrades
# specifically to stop the gate touching their network will not expect anything left behind.
#
# So downgrade in this ORDER: disarm from the GUI (or set SLUICE_ENABLED=0 and let one pass run)
# BEFORE removing the overlay, while the worker still has the privilege to clean up. If the table
# is already orphaned, remove it directly on the node:
#
#     nft delete table inet weirvern_sluice
#
# `k8s/32-zeek.yaml` carries the same warning for the sensor's sysctls, which have the identical
# problem: an init container writes them and nothing reverts them on overlay removal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weirvern-worker
  namespace: weirvern
spec:
  template:
    spec:
      # ClusterFirstWithHostNet is required, not decorative: the default for a hostNetwork pod
      # is `Default`, which uses the node's resolver and cannot resolve cluster Services.
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      # POD-LEVEL OVERRIDE, and it is required rather than cosmetic.
      #
      # The base worker manifest sets `runAsNonRoot: true` and `runAsUser: 10001` at the POD
      # level (to match the uid baked into the image and the gid on the host directories).
      # Setting runAsUser: 0 only on the container makes the API server reject the pod:
      #
      #   Error: container's runAsUser breaks non-root policy
      #   CreateContainerConfigError
      #
      # The pod does not start at all, which is at least loud -- but the message points at the
      # container when the constraint is declared on the pod, so it reads like a container bug.
      # Both levels have to agree.
      #
      # runAsNonRoot is set to FALSE rather than removed: leaving it unset would inherit true
      # from the base, and an explicit false documents that the departure is intentional.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        # fsGroup stays: it governs ownership of mounted volumes and is orthogonal to the
        # capability question. Root ignores it, non-root containers still need it.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW", "NET_ADMIN"]
