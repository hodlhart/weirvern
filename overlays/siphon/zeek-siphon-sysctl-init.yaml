# The privileged initContainer that sets siphon mode's three sysctls.
#
# WHY AN INIT CONTAINER AT ALL. A pod cannot declare these sysctls for itself: the API server
# rejects pod-level sysctls whenever hostNetwork is true ("may not be specified when
# 'hostNetwork' is true"). And holding CAP_NET_ADMIN is not enough either, because Kubernetes
# mounts /proc/sys read-only for a normal container -- measured: "cannot create
# /proc/sys/net/ipv4/conf/all/send_redirects: Read-only file system", from a container that
# DOES hold the capability. Privileged gets a writable /proc; nothing less does.
#
# WHY IT IS PRIVILEGED AND THE ZEEK CONTAINER IS NOT. This container exists to write three
# files and exit. It needs no network device, no capture socket, and no long lifetime. The
# sniffer parses untrusted input from the wire continuously, so it is the process worth
# keeping unprivileged; a compromise there should not come with the ability to rewrite node
# networking. The privilege is scoped to the step that needs it.
#
# WHY init AND NOT A KUBECTL STEP. `kubectl apply -k overlays/siphon/` is then the entire
# procedure. An initContainer also runs on every zeek container start, including restarts, so
# a node reboot or a kubelet restart cannot leave the sensor believing it is intercepting with
# forwarding disabled -- which is the failure that takes a LAN down.
#
# WHY IT VERIFIES AFTER WRITING. Writing is not the same as taking. The container re-reads all
# three, and exits non-zero if any did not stick, which keeps the DaemonSet pod in
# Init:Error rather than starting a sensor that would blackhole traffic. It also refuses to
# proceed if a sysctl cannot be read at all, since "cannot read" must never be treated as
# "already correct".
#
# WHY IT NOW SAVES THE ORIGINALS FIRST, AND WHY THIS IS A FIX AND NOT A NICETY.
#
# This container changes NODE-WIDE kernel networking and used to do so without recording what it
# found. Applying the siphon overlay therefore left no way to answer "what was rp_filter before
# Weirvern touched it?" -- and the answer is not uniform. This project's notes record the node
# default as rp_filter=2 and send_redirects=1, but a hardened host, a CNI, or a previous deployment
# may have set something else, and an operator reverting the overlay has no way to know. The values
# are now written down, and a ready-to-run restore script is generated FROM them, so the overlay is
# REVERSIBLE rather than merely removable.
#
# WHY THE PER-INTERFACE SWEEP IS NARROWED. The old version wrote rp_filter=0 and
# send_redirects=0 to EVERY interface on the node -- including interfaces this sensor has nothing
# to do with. On a shared host that changes the security posture of somebody else's network. It now
# writes `all` and `default` (which interfaces inherit) plus the capture interface when named. A
# narrower blast radius is a correctness fix, not tidiness.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zeek
  namespace: weirvern
spec:
  template:
    spec:
      # Declared here because the init container writes the pre-siphon values and the generated
      # restore script into it. `DirectoryOrCreate` so a first apply on a fresh node succeeds --
      # this volume has to exist before an init container runs, which is before anything else.
      volumes:
        - name: siphon-state
          hostPath:
            path: /var/lib/weirvern/flows
            type: DirectoryOrCreate
      initContainers:
        - name: siphon-sysctls
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          # The sensor image has no shell tools beyond busybox ash and, notably, no `ip`; using
          # busybox here keeps this step independent of the zeek image entirely, so changing the
          # sniffer's base cannot break bringing up its networking.
          command:
            - sh
            - -c
            - |
              set -eu
              # Read a value, or fail loudly. `|| echo` defaults are deliberately NOT used:
              # a missing file means we cannot verify, and silently assuming the wanted value
              # is how a broken intercept looks healthy.
              read_sysctl() {
                if [ ! -r "/proc/sys/$1" ]; then
                  echo "[siphon-init] FATAL: cannot read /proc/sys/$1" >&2
                  exit 1
                fi
                tr -d '\n' < "/proc/sys/$1"
              }

              echo "[siphon-init] configuring forwarding for in-path intercept"

              # ── SAVE THE ORIGINALS BEFORE TOUCHING ANYTHING ───────────────────────────────
              # Written to the hostPath the operator already knows, so the values are readable
              # from the host without entering a container: the whole point of recording them is
              # that they outlive the deployment being undone.
              #
              # FIRST RUN WINS (issue #12, 2026-10-16). The save used to be unconditional, so a
              # second init run -- any pod restart, any node rejoin -- recorded the values this
              # overlay had ALREADY changed as the "before" state, and the documented restore
              # then restored the modified values: a silent no-op on the host that was supposed
              # to be handed back exactly as found. If something is already recorded, it is left
              # byte-identical and the run SAYS so. An EMPTY file means a first run that failed
              # to record, so it is still written -- nothing recorded yet is the only state that
              # records.
              SAVE=/var/lib/weirvern/flows/siphon-sysctls.saved
              RESTORE=/var/lib/weirvern/flows/siphon-sysctls.restore.sh
              CAPTURE_IFACE="${CAPTURE_IFACE:-}"
              if [ -s "$SAVE" ]; then
                echo "[siphon-init] originals already recorded at $SAVE; keeping them (first run wins)"
              else
                {
                  echo "# Written by the Weirvern siphon overlay at $(date -u +%FT%TZ)"
                  echo "# Kernel networking values on this node BEFORE the overlay changed them."
                  echo "# Restore with:  sh $RESTORE"
                  echo "ip_forward=$(read_sysctl net/ipv4/ip_forward)"
                  echo "all_rp_filter=$(read_sysctl net/ipv4/conf/all/rp_filter)"
                  echo "all_send_redirects=$(read_sysctl net/ipv4/conf/all/send_redirects)"
                  echo "default_rp_filter=$(read_sysctl net/ipv4/conf/default/rp_filter)"
                  echo "default_send_redirects=$(read_sysctl net/ipv4/conf/default/send_redirects)"
                  if [ -n "$CAPTURE_IFACE" ]; then
                    echo "capture_iface=$CAPTURE_IFACE"
                    echo "capture_rp_filter=$(read_sysctl "net/ipv4/conf/$CAPTURE_IFACE/rp_filter")"
                    echo "capture_send_redirects=$(read_sysctl "net/ipv4/conf/$CAPTURE_IFACE/send_redirects")"
                  fi
                } > "$SAVE" 2>/dev/null || echo "[siphon-init] WARNING: could not save originals to $SAVE"
              fi

              # Generated FROM the saved values so it cannot drift from them, and it REFUSES to
              # run without them rather than restoring defaults -- "restore" must not mean "guess".
              {
                echo "#!/bin/sh"
                echo "# Restores the kernel networking the Weirvern siphon overlay changed."
                echo "# Generated at apply time from the values actually found on this node."
                echo "set -eu"
                echo "SAVE=$SAVE"
                echo 'if [ ! -r "$SAVE" ]; then'
                echo '  echo "FATAL: $SAVE is missing; refusing to guess the originals." >&2'
                echo '  exit 1'
                echo "fi"
                echo '. "$SAVE"'
                echo 'w() { if [ -w "$1" ]; then echo "$2" > "$1" && echo "  set $1=$2"; fi; }'
                echo 'echo "restoring pre-siphon kernel networking:"'
                echo 'w /proc/sys/net/ipv4/ip_forward "$ip_forward"'
                echo 'w /proc/sys/net/ipv4/conf/all/rp_filter "$all_rp_filter"'
                echo 'w /proc/sys/net/ipv4/conf/all/send_redirects "$all_send_redirects"'
                echo 'w /proc/sys/net/ipv4/conf/default/rp_filter "$default_rp_filter"'
                echo 'w /proc/sys/net/ipv4/conf/default/send_redirects "$default_send_redirects"'
                echo 'if [ -n "${capture_iface:-}" ]; then'
                echo '  w /proc/sys/net/ipv4/conf/$capture_iface/rp_filter "$capture_rp_filter"'
                echo '  w /proc/sys/net/ipv4/conf/$capture_iface/send_redirects "$capture_send_redirects"'
                echo 'fi'
                echo 'echo "done. Check with: sysctl net.ipv4.ip_forward net.ipv4.conf.all.rp_filter"'
              } > "$RESTORE" 2>/dev/null && chmod +x "$RESTORE" 2>/dev/null \
                || echo "[siphon-init] WARNING: could not write $RESTORE"

              echo "[siphon-init] originals recorded in $SAVE"

              # ip_forward: without it the ARP mapping is forged and the traffic is DROPPED.
              echo 1 > /proc/sys/net/ipv4/ip_forward

              # rp_filter: reverse-path filtering discards relayed packets whose return route
              # differs from the arrival interface. `all` is set, and so is the capture
              # interface's own value, because the per-interface setting overrides `all` and
              # the capture NIC is exactly where a mismatch would be dropped.
              echo 0 > /proc/sys/net/ipv4/conf/all/rp_filter
              echo 0 > /proc/sys/net/ipv4/conf/default/rp_filter
              # NARROWED. `all` and `default` are the inherited values; the capture port is where a
              # reverse-path mismatch would actually be dropped. Every other interface on the node
              # is left alone -- see the note above the container for why that is a correctness fix.
              if [ -n "$CAPTURE_IFACE" ] && [ -w "/proc/sys/net/ipv4/conf/$CAPTURE_IFACE/rp_filter" ]; then
                echo 0 > "/proc/sys/net/ipv4/conf/$CAPTURE_IFACE/rp_filter"
              fi

              # send_redirects: the kernel otherwise tells the victim to send directly, undoing
              # the intercept a few packets in. Also set per-interface for the same reason.
              echo 0 > /proc/sys/net/ipv4/conf/all/send_redirects
              echo 0 > /proc/sys/net/ipv4/conf/default/send_redirects
              if [ -n "$CAPTURE_IFACE" ] && [ -w "/proc/sys/net/ipv4/conf/$CAPTURE_IFACE/send_redirects" ]; then
                echo 0 > "/proc/sys/net/ipv4/conf/$CAPTURE_IFACE/send_redirects"
              fi

              # Verify rather than assume: a write that silently did not take is the whole
              # failure this container exists to prevent.
              ipf=$(read_sysctl net/ipv4/ip_forward)
              rpf=$(read_sysctl net/ipv4/conf/all/rp_filter)
              srd=$(read_sysctl net/ipv4/conf/all/send_redirects)
              echo "[siphon-init] ip_forward=$ipf rp_filter=$rpf send_redirects=$srd"

              if [ "$ipf" != "1" ] || [ "$rpf" != "0" ] || [ "$srd" != "0" ]; then
                echo "[siphon-init] FATAL: sysctls did not take." >&2
                echo "[siphon-init] FATAL: refusing to start an intercept that cannot forward." >&2
                exit 1
              fi
              echo "[siphon-init] forwarding path configured"
          # CAPTURE_IFACE IS NOT OPTIONAL FOR THIS CONTAINER. Without it the narrowed sweep falls
          # back to `all` and `default`, and the interface whose rp_filter actually matters -- the
          # capture port -- keeps the inherited value. It reads the same ConfigMap key the sniffer
          # reads, so the two cannot disagree about which interface they mean.
          env:
            - name: CAPTURE_IFACE
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: ZEEK_IFACE
                  optional: true
          # ITS OWN VOLUME, DELIBERATELY. The obvious shortcut was to reuse the base DaemonSet's
          # `zeek-logs` volume -- but that one is the hostPath /var/lib/weirvern/zeek, so mounting
          # it at /var/lib/weirvern/flows would write the saved values and the restore script into
          # ZEEK'S LOG DIRECTORY, where the pruner deletes old files and the ingester tails
          # everything. They would be ingested as log lines and eventually pruned away, which is
          # the opposite of outliving the deployment. One hostPath removes that whole class of
          # surprise.
          volumeMounts:
            - name: siphon-state
              mountPath: /var/lib/weirvern/flows
          securityContext:
            # Privileged because it edits node-wide networking; the alternative (NET_ADMIN
            # alone) is insufficient -- /proc/sys is mounted read-only without it.
            #
            # `allowPrivilegeEscalation` is NOT set to false here, and that is not an
            # oversight. The API server rejects the combination outright -- verified:
            #
            #   cannot set `allowPrivilegeEscalation` to false and `privileged` to true
            #
            # which is correct in spirit: the privilege IS the escalation this container needs.
            # The containment is scope -- three writes, then exit -- rather than a flag.
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
