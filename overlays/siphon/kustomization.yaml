# siphon-mode overlay: what in-path intercept needs, and nothing more.
#
# WHY A SEPARATE OVERLAY. The default deployment is `loch` (passive) and its securityContext
# is deliberately tight: all capabilities dropped, NET_RAW re-added because libpcap cannot open
# a raw socket without it, no privilege escalation, seccomp RuntimeDefault, no service-account
# token. `siphon` needs strictly more. More privilege is not something to add to the default
# because a mode might want it, so it is opt-in:
#
#     kubectl apply -k k8s/               # loch: NET_RAW only
#     kubectl apply -k overlays/siphon/     # siphon: NET_RAW + NET_ADMIN + sysctls
#
# The overlay lives OUTSIDE k8s/ deliberately: kustomize refuses a kustomization that
# references a directory containing itself ("cycle detected"), and an overlay nested under its
# own base triggers exactly that.
#
# ── THE SYSCtlS, WHICH ARE THE WHOLE DIFFICULTY ────────────────────────────────────────────
#
# `siphon` needs three sysctls. Each has its own failure symptom, and all three are wrong by
# default on this node:
#
#   net.ipv4.ip_forward=1            Without it we forge the ARP mapping and then DROP the
#                                    traffic: every intercepted host leaves the network, and
#                                    it presents as a hardware fault.
#   net.ipv4.conf.all.rp_filter=0    Reverse-path filtering discards relayed packets whose
#                                    return route differs from the arrival interface: one-way
#                                    traffic and hanging TCP connects.
#   net.ipv4.conf.all.send_redirects=0
#                                    The kernel tells the victim to send directly, silently
#                                    undoing the intercept a few packets in. The MITM "works",
#                                    then quietly stops.
#
# A pod CANNOT declare them for itself. The API server refuses pod-level sysctls whenever
# hostNetwork is true -- verified against the live cluster:
#
#     spec.template.spec.securityContext.sysctls[0].name: Invalid value:
#     "net.ipv4.ip_forward": may not be specified when 'hostNetwork' is true
#
# And holding CAP_NET_ADMIN is NOT sufficient, because Kubernetes mounts /proc/sys READ-ONLY
# for a normal container. Measured from the running zeek container, which holds NET_RAW:
#
#     mount: proc on /proc/sys type proc (ro,nosuid,nodev,noexec,relatime)
#     write: cannot create /proc/sys/net/ipv4/conf/all/send_redirects: Read-only file system
#
# That error reads like a permissions problem, which is why it was worth measuring: the
# capability is present and the mount is the blocker.
#
# ── HOW IT IS SOLVED, ALSO MEASURED ────────────────────────────────────────────────────────
#
# An initContainer with `privileged: true` gets a writable /proc/sys. Measured in a probe pod
# on the node (same-value writes, so nothing changed):
#
#     /proc/sys is NOT a read-only mount here
#     send_redirects <- 0   OK      (now 0)
#
# Because the pod shares the node's network namespace, the container's /proc/sys IS the node's,
# so this configures the sensor's own host from inside the manifest -- no manual node step.
#
# (Two earlier runs of that probe reported all three keys REFUSED while a single write to the
# same file reported OK. That was a defect in the probe -- `net.ipv4.ip_forward` was used as a
# filesystem path instead of `net/ipv4/ip_forward` -- and reporting it as a finding would have
# been a conclusion about the mechanism drawn from the instrument. Hence the re-measurement.)

kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
  - ../../k8s

patches:
  - path: zeek-siphon-patch.yaml
    target:
      kind: DaemonSet
      name: zeek

  - path: zeek-siphon-sysctl-init.yaml
    target:
      kind: DaemonSet
      name: zeek

  # The WORKER runs the intercept -- `weirvern intercept` is a control-plane command, so it
  # executes in the worker pod, and the sensor's NET_ADMIN does nothing for it. See the patch
  # for why NET_RAW and NET_ADMIN are both needed and neither implies the other.
  - path: worker-siphon-caps.yaml
    target:
      kind: Deployment
      name: weirvern-worker

# The sysctls are set by the initContainer rather than by hand so that the overlay is
# self-contained: `kubectl apply -k overlays/siphon/` is the entire procedure, and there is no
# second step to forget. The initContainer runs before every zeek container start (including
# restarts), so a node reboot or a kubelet restart cannot leave the sensor in siphon mode with
# forwarding off.
#
# WHY THE INIT CONTAINER IS PRIVILEGED AND THE ZEEK CONTAINER IS NOT: the privilege is needed
# only to write three files, once, before zeek starts. It is not needed to capture, parse, or
# forward -- forwarding is a kernel function, not a container one. Keeping the long-running
# sniffer unprivileged means a compromise of the process that parses untrusted network data
# does not come with the ability to rewrite node networking.
