# The backup engine's write guard (issue #16).
#
# ClickHouse REFUSES a backup to a disk the server has not been told it may write to. Without
# this drop-in the operator gets, verbatim:
#
#   Code: 318. DB::Exception: The 'backups.allowed_disk' configuration parameter is not set,
#   cannot use 'Disk' backup engine. (INVALID_CONFIG_PARAMETER)
#
# and the backup procedure in docs/operations.md cannot run on the shipped stack. This names
# the cluster's own data disk, so `BACKUP ... TO Disk('default', 'backups/<name>')` writes
# under /var/lib/clickhouse/backups/ on the clickhouse PVC. It is mounted as a config.d
# drop-in (NOT over the whole directory -- that would shadow the image's own drop-ins).
apiVersion: v1
kind: ConfigMap
metadata:
  name: weirvern-clickhouse-config
  namespace: weirvern
data:
  zz-weirvern-backups.xml: |
    <clickhouse>
      <backups>
        <allowed_disk>default</allowed_disk>
        <allowed_path>/var/lib/clickhouse/backups</allowed_path>
      </backups>
    </clickhouse>
---
# ClickHouse — the storage layer.
#
# StatefulSet rather than Deployment: the data PVC and the pod identity must be
# stable across restarts. A Deployment would let two pods mount the same
# ReadWriteOnce volume during a rolling update, which corrupts ClickHouse's
# data directory.
#
# SINGLE REPLICA BY DESIGN. This is a single-node ClickHouse, which is correct
# for a homelab and for a small production deployment. Scaling out needs
# ClickHouse Keeper and a replicated schema, which is a schema change, not a
# replicas change — do not simply raise `replicas` here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: weirvern
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: weirvern
    spec:
      securityContext:
        # The upstream image runs as uid 101. Setting it here means the
        # permission-fix initContainer below and the main container agree.
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A dynamically provisioned volume is usually owned by root, and
        # ClickHouse cannot write its data directory as uid 101. This makes the
        # mount usable. Cheap, idempotent, and only touches the two paths the
        # container actually needs.
        - name: fix-permissions
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              chown -R 101:101 /var/lib/clickhouse /var/log/clickhouse-server
              echo "permissions set"
          securityContext:
            # chown requires root, so this container alone runs as root. It does
            # no network I/O and exits immediately.
            #
            # runAsNonRoot MUST be overridden to false HERE, not just
            # runAsUser: 0. kubelet rejects the container outright otherwise:
            #
            #   Error: container's runAsUser breaks non-root policy
            #
            # The pod-level runAsNonRoot: true is inherited by every container
            # including this one, and it is a positive assertion that must hold,
            # so setting runAsUser: 0 alongside it is a contradiction kubelet
            # resolves by refusing to create the container. The result was
            # ClickHouse stuck in Init:CreateContainerConfigError and the database
            # never starting. This is not a Pod Security Admission issue -- the
            # namespace enforces `privileged' -- kubelet applies runAsNonRoot
            # itself, so raising the PSA level does NOT help.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-logs
              mountPath: /var/log/clickhouse-server
          # Declared so a namespace with a ResourceQuota requiring requests does
          # not reject the Pod. This container only chowns two paths and exits.
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      automountServiceAccountToken: false
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: weirvern-env
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weirvern-secrets
                  key: CLICKHOUSE_PASSWORD
            # ── THIS IS WHAT MAKES THE DATABASE REACHABLE FROM OTHER PODS ────────
            #
            # Verified on a real cluster by reading the official entrypoint:
            #
            #   if CLICKHOUSE_USER is set and != "default" (or a password is set),
            #     the entrypoint GENERATES users.d/default-user.xml containing
            #     <default remove="remove"/> plus the named user with
            #     <networks><ip>::/0</ip></networks>
            #
            #   else  ->  "disabling network access for user 'default'" and writes
            #             localhost-only networks
            #
            # So with neither variable set -- which is how this shipped -- ClickHouse
            # deliberately locks `default` down to 127.0.0.1/::1. Every other pod is
            # refused by the NETWORK FILTER, before the password is examined, so the
            # error blames the credential:
            #
            #   Code: 194. DB::Exception: default: Authentication failed:
            #   password is incorrect, or there is no user with such name
            #
            # That message is actively misleading, and it is why the same query run
            # via `kubectl exec` into the pod SUCCEEDS (source 127.0.0.1) while the
            # worker and schema Job retry forever. The deployment could not reach its
            # own database, and the failure looked like a bad password.
            #
            # Setting the user name here is the supported, upstream-intended fix. Do
            # NOT hand-write a users.d file: the entrypoint overwrites
            # default-user.xml at startup, so a mounted one would be ignored.
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: CLICKHOUSE_USER
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-logs
              mountPath: /var/log/clickhouse-server
            # The backup engine's write guard (issue #16). A FILE mount, not a directory
            # mount: dropping a directory here would shadow the image's own config.d.
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/zz-weirvern-backups.xml
              subPath: zz-weirvern-backups.xml
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            # ClickHouse is memory-hungry for aggregation; a limit that is too
            # low turns a large query into an OOM kill that looks like a crash.
            limits:
              cpu: "2"
              memory: "4Gi"
          # /ping returns 200 as soon as the HTTP port is serving, which is the
          # earliest correct readiness signal — TCP acceptance is not enough,
          # because the server accepts before it can run queries.
          readinessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
            # Generous threshold: a heavy query can briefly starve the probe and
            # restarting the database mid-query is far worse than a slow ping.
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # ClickHouse's own server log needs a writable path, but it is a cache of
        # diagnostics — not data — so it is an emptyDir: it survives a container
        # restart within the pod (which is when the log is most useful), and does
        # not consume the persistent volume or block rescheduling.
        - name: clickhouse-logs
          emptyDir:
            sizeLimit: 1Gi
        # Consumed by the mount above; defined as the first document in this file.
        - name: clickhouse-config
          configMap:
            name: weirvern-clickhouse-config
            items:
              - key: zz-weirvern-backups.xml
                path: zz-weirvern-backups.xml
  volumeClaimTemplates:
    # NOTE: this template applies only to a NEWLY created StatefulSet. Changing
    # it for an existing one has no effect on the already-bound claim.
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
---
# Headless Service for the StatefulSet's stable network identity.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: weirvern
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
# Optional external access to ClickHouse, for `weirvern status` from a
# workstation or for a browser-based query UI. Disabled by default because
# exposing a database to the LAN is a decision, not a convenience.
#
# To enable: uncomment `type: NodePort` AND uncomment the nodePort lines.
# `nodePort` is only valid on NodePort/LoadBalancer services — leaving it on a
# ClusterIP service makes the manifest invalid and the whole file fails to
# apply.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-external
  namespace: weirvern
  annotations:
    weirvern.io/note: "disabled by default; uncomment type: NodePort to enable"
spec:
  # type: NodePort
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
      # nodePort: 30123
