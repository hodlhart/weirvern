# The web GUI.
#
# AUTHENTICATED, AND THAT IS WHAT MAKES THE WRITES ACCEPTABLE. It began read-only by
# design; it now writes the configuration and accounts under a signed-in admin account
# (or the deployment operator token, as break-glass recovery). Reads require a signed-in
# account whenever accounts are provisioned. Start, stop and apply still stay in the CLI,
# which an operator runs knowingly -- there is no lifecycle control here.
#
# WHY A NodePort RATHER THAN AN INGRESS OR A PORT-FORWARD:
#   * An ingress would need a controller, which a homelab may not have and which
#     this project has deliberately not required anywhere else.
#   * A port-forward works for one-off CLI access (it runs as one process and the tunnel
#     dies with it) but not for a browser: the dashboard must stay reachable while the
#     operator clicks around, and a foreground kubectl would have to stay open in
#     a terminal the whole time. The CLI's automatic tunnel is implemented in
#     weirvern/admin/tunnel.py for exactly the cases where it does fit.
#   * So a NodePort is the honest answer for a long-lived browser session, and the
#     Service is the single place that decides who can reach it.
#
# The GUI reads ClickHouse over the cluster network, so unlike the sensors it does
# NOT need hostNetwork, a hostPath, or any capability. It is the most ordinary
# workload in the project.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weirvern-gui
  namespace: weirvern
  labels:
    app.kubernetes.io/name: weirvern-gui
    app.kubernetes.io/part-of: weirvern
spec:
  # Safe to run more than one replica: this is stateless and read-only, with no
  # in-process alert state and no hostPath to contend over. (The WORKER is the
  # single-replica workload, for those reasons.)
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weirvern-gui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weirvern-gui
        app.kubernetes.io/part-of: weirvern
    spec:
      # WHY THIS POD IS THE EXCEPTION. Every other workload here sets this false, and for a
      # read-only service that is right. The GUI now WRITES configuration, and it does so by
      # calling the Kubernetes API directly (the image ships no kubectl), so it needs the
      # ServiceAccount token.
      #
      # The grant is deliberately narrow: weirvern-operator's Role covers get+patch on
      # configmaps in this namespace plus workload restarts. A token in this pod is also NOT by
      # itself enough to change anything -- writes are additionally gated on the operator
      # token, so even a compromised pod cannot reconfigure the sensor without it.
      automountServiceAccountToken: true
      serviceAccountName: weirvern-operator
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "waiting for clickhouse:8123"
              for i in $(seq 1 120); do
                if nc -z clickhouse 8123 2>/dev/null; then echo "clickhouse is up"; exit 0; fi
                sleep 2
              done
              echo "clickhouse did not become ready; starting anyway (the GUI reports it)" >&2
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: gui
          image: weirvern-worker
          # GUI_HOST=0.0.0.0 is REQUIRED here. The CLI defaults to 127.0.0.1 so
          # that running it on a workstation does not accidentally publish the
          # dashboard; inside a pod, binding to loopback would make the Service
          # unreachable and the NodePort silently useless.
          command: ["python", "-m", "weirvern.admin.cli", "gui"]
          # WEIRVERN_REVERSE_DNS IS DELIBERATELY NOT PINNED HERE. It used to be set to
          # "private" in this env: list, and a pod's own `env:` entry SHADOWS envFrom -- so
          # the ConfigMap value could never reach the GUI, and changing the setting from the
          # Settings tab (which writes the ConfigMap) was inert while every surface reported
          # it saved. Live-measured: ConfigMap 'all', GUI pod still 'private'. The default
          # lives in k8s/20-configmap-env.yaml now, which is the one place a settings write
          # updates; weirvern/admin/revdns.py keeps 'private' as its code default for a
          # process with no environment at all.
          env:
            - name: GUI_HOST
              value: "0.0.0.0"
            - name: GUI_PORT
              value: "8088"
            # NODE_NAME, for the same reason as the worker: the GUI READS the gate's state rows,
            # which are keyed by sensor, and it must compute the SAME identity the worker writes
            # under. Inside a pod `socket.gethostname()` is the pod name, so without this the GUI
            # filters to a name the worker never wrote and the panel reports "the gate has not run
            # yet" on a gate that is working. See k8s/33-worker.yaml for the full reasoning.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # THE SENSOR'S BOUNDARY, NOT THE KERNEL'S BIGGER VIEW. File-mounting the host's
            # /proc/meminfo and /proc/stat gives the LXC/VM's 10 GiB and 4 CPUs; the pod's
            # /proc reports the 40 GiB kernel view, and a directory hostPath of /proc reported
            # the 512 MiB pod limit. The explicit path is authoritative in system_metrics.
            - name: HOST_PROC
              value: "/host-proc"
            - name: HOST_SYS
              value: "/host-sys"
          envFrom:
            - configMapRef:
                name: weirvern-env
            - secretRef:
                name: weirvern-secrets
          ports:
            - name: http
              containerPort: 8088
          # The GUI needs kubectl to list workloads, and the image does not ship
          # it. Without this the Workloads panel is empty while everything else
          # works, which looks like a bug rather than a missing binary.
          #
          # If your image lacks kubectl, either add it to the Containerfile or
          # accept an empty Workloads panel: every data panel (health, anomalies,
          # talkers, drill-down) talks to ClickHouse directly and is unaffected.
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Deliberately /api/healthz, which does NOT touch ClickHouse. A probe
            # that fails when the database is slow would restart the GUI and hide
            # the real problem -- the same mistake the worker's probe made.
            #
            # timeoutSeconds is 5, not the default 1: the worker's probe was fixed
            # for exactly this reason (a cold Python import exceeded 1s on a loaded
            # node and restarted a healthy process every 3 minutes).
            httpGet: {path: /api/healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # THE HOST'S PROCFS, READ-ONLY (operator, 2026-10-19). The system cards must
            # describe the sensor box, not this container's cgroup: /proc inside the pod is
            # the wrong machine. Mounted at /host-proc; the route never writes it.
            # The parent is an emptyDir; the two files are host file mounts. A hostPath
            # DIRECTORY of /proc was measured at 512 MiB (the pod limit), not the VM; a
            # hostPath FILE of /proc/meminfo is the 10 GiB VM boundary.
            - name: host-proc
              mountPath: /host-proc
              readOnly: true
            - name: host-proc-meminfo
              mountPath: /host-proc/meminfo
              readOnly: true
            - name: host-proc-stat
              mountPath: /host-proc/stat
              readOnly: true
            # Interface counters live in sysfs, not procfs: /proc/net follows the pod's
            # network namespace even when procfs is the host's.
            - name: host-sys
              mountPath: /host-sys
              readOnly: true
      volumes:
        # readOnlyRootFilesystem is on, so Python needs a writable /tmp for
        # bytecode caches and temp files. An emptyDir is the minimum that allows.
        - name: tmp
          emptyDir: {}
        - name: host-proc
          emptyDir: {}
        - name: host-proc-meminfo
          hostPath:
            path: /proc/meminfo
            type: File
        - name: host-proc-stat
          hostPath:
            path: /proc/stat
            type: File
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: weirvern-gui
  namespace: weirvern
  labels:
    app.kubernetes.io/name: weirvern-gui
    app.kubernetes.io/part-of: weirvern
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: weirvern-gui
  ports:
    - name: http
      port: 8088
      targetPort: http
      # 30088 rather than an auto-assigned port, so the URL in the README is
      # stable and a firewall rule can be written once.
      nodePort: 30088
