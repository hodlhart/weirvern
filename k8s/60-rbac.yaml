# Least-privilege RBAC.
#
# WHY THIS FILE EXISTS: the Weirvern CLI reads cluster state to show
# service health (`weirvern status`). That needs an identity
# with `get`/`list` on a narrow set of resources — not cluster-admin, and not an
# operator's personal kubeconfig with full rights.
#
# Create a kubeconfig for the control plane from this ServiceAccount token:
#
#     kubectl -n weirvern create token weirvern-viewer --duration=24h
#
# Two roles, deliberately separate:
#   * viewer  — read-only. This is what `weirvern status` uses by default.
#   * operator — adds the lifecycle verbs (scale, rollout restart). Assign it
#     only to a human who is allowed to stop the pipeline, not to a monitoring
#     process.
#
# Note what is NOT granted anywhere: secrets. The status tooling does not read
# the Pushover token, so an account that displays health cannot exfiltrate the
# alert credentials.
#
# EXCEPTION, stated because the previous version of this comment overstated it:
# `weirvern install` DOES read the secret, to verify the Pushover keys are
# present before you rely on alerting. Under the viewer role that check cannot
# complete, and cmd_install reports it as "cannot read (RBAC)" rather than as a
# missing credential — a permission failure and a configuration failure are
# different problems and must not be conflated. Use the operator kubeconfig, or
# grant a narrow `get` on this one secret, if you want the install check to
# verify credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirvern-viewer
  namespace: weirvern
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirvern-operator
  namespace: weirvern
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weirvern-viewer
  namespace: weirvern
rules:
  # Read pod and workload state for the health panel.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  # Logs: `weirvern logs` reads these. Bounded to this namespace.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weirvern-operator
  namespace: weirvern
rules:
  # ── WHAT THE OPERATOR ROLE MAY REACH, AND WHY IT IS NARROWER THAN IT LOOKS ─────────────────
  #
  # AUDIT F017, CONFIRMED AGAINST A LIVE CLUSTER. This role granted patch/update on the WHOLE
  # `daemonsets` resource. Measured with a server-side dry run, the GUI's ServiceAccount could
  # rewrite the zeek DaemonSet -- which is `privileged: true`, holds CAP_NET_RAW, and mounts host
  # paths:

  #     kubectl patch ds/zeek --as=system:serviceaccount:<ns>:weirvern-operator \
  #       -p '{"spec":{"template":{"spec":{"volumes":[{"name":"host-root",
  #            "hostPath":{"path":"/"}}]}}}}' --dry-run=server
  #     -> daemonset.apps/zeek patched
  #
  # The only objection was a PodSecurity WARNING. The namespace is labelled
  # `pod-security.kubernetes.io/enforce: privileged`, so nothing enforces it -- and that label is
  # deliberate, because the capture sensor genuinely needs those capabilities. The consequence:
  # a compromised GUI pod could mount the node filesystem on every node. The GUI is a NodePort
  # HTTP service with password auth, so "a compromised GUI pod" is not hypothetical.
  #
  # THE GRANT IS NOW SCOPED BY NAME. `resourceNames` is verified live to work per object:
  #
  #     with resourceNames=[zeek]:  patch daemonsets/zeek -> yes
  #                                 patch daemonsets/clickhouse -> no
  #
  # The GUI's settings path restarts exactly two workloads (`_RESTART_FOR` in
  # admin/cluster_config.py) plus itself, so those three names are the whole of what it needs.
  # `update` is NOT granted on any workload object: a PUT replaces the entire object, so one
  # malformed request could strip a workload's securityContext. Its only appearance is on the
  # name-scoped /scale subresources further down, where it carries `spec.replicas` alone.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  # The restart path, name-scoped. Each entry is one workload the settings UI may roll.
  #
  # THEY ARE SEPARATE RULES ON PURPOSE: a single rule listing all three `resourceNames` would also
  # need a single verb set, and keeping them apart means the reason for each is visible and a
  # future addition has to be deliberate.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["zeek"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["weirvern-worker", "weirvern-gui"]
    verbs: ["patch"]
  # THE STOP/START PATH (`weirvern stop` / `weirvern start`), name-scoped to exactly the
  # workloads the CLI drives (`runtime.WORKLOADS`): the database, the exporter and the consumer.
  # An unscoped scale grant let this Role rescale anything in the namespace -- including objects
  # it has no other business touching. `update` lives ONLY here, on the /scale subresource: a PUT
  # there carries `spec.replicas` alone, so unlike a PUT on the workload itself it cannot strip a
  # securityContext. See the note above: `update` is granted on no workload object.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["goflow2", "weirvern-worker"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["clickhouse"]
    verbs: ["get", "patch", "update"]
  # The Sonar survey Job. THE ONE GRANT THAT CANNOT BE NAMED -- MEASURED, NOT ASSUMED (issue #10,
  # 2026-10-16): the job is created with a random suffix (`weirvern-sonar-<8 hex>` in
  # admin/sonar.py) so concurrent surveys do not collide, and a live probe proved the API server
  # DENIES a `create` scoped by `resourceNames` even when the name matches exactly. So the only
  # choices are an unscoped `create` here or no `create` at all.
  #
  # WHAT IS NOT TRUE, and stood in this comment first: that the blast radius is bounded because
  # "it runs the weirvern-worker image". The pod spec is chosen by whoever submits the Job. Any
  # holder of this grant can submit any spec this namespace admits -- and the namespace enforces
  # `privileged`, because the capture sensor genuinely needs those capabilities. A jobs-create
  # grant here is therefore a node-escape capability, held by a NodePort HTTP service with
  # password auth. That is exactly why it is a deliberate, documented choice rather than a
  # convenience, and why the way to remove it is to not want in-GUI surveys: drop `create` (and
  # `delete`) and run surveys from the CLI, which the GUI reports cleanly instead of failing
  # oddly. `delete` is here because the GUI deletes the Job after reading its log; the TTL
  # (`ttlSecondsAfterFinished`) only covers a GUI that dies mid-survey.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/portforward"]
    verbs: ["get", "create"]
  # THE CONFIG WRITE PATH. `patch` is NAME-SCOPED to the two objects the GUI writes: `weirvern-env`
  # (settings) and `weirvern-users` (the account store). An unscoped configmap write let this Role
  # patch ANY ConfigMap in the namespace -- including sensor configuration a root pod executes.
  # `update` is deliberately NOT granted anywhere on configmaps: a PUT replaces every key.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["weirvern-env", "weirvern-users"]
    verbs: ["patch"]
  #
  # The first-startup CREATE cannot be named -- same measurement as the jobs grant above: a live
  # probe with `resourceNames=[the exact object]` was denied the create. It stays because the
  # account store has to exist before anyone can sign in, and the alternative (shipping a
  # placeholder manifest) was rejected for the reason the file header gives: `kubectl apply -k`
  # would re-apply it with empty values and silently wipe live accounts. What a create can make
  # here is a ConfigMap nobody reads until it is named `weirvern-users`.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # Reads stay namespace-scoped rather than name-scoped: the GUI reads its own store, the settings
  # ConfigMap and (for drift display) the sensor config, and a read cannot reconfigure anything.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weirvern-viewer
  namespace: weirvern
subjects:
  - kind: ServiceAccount
    name: weirvern-viewer
    namespace: weirvern
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weirvern-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weirvern-operator
  namespace: weirvern
subjects:
  - kind: ServiceAccount
    name: weirvern-operator
    namespace: weirvern
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weirvern-operator
