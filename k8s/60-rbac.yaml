# Least-privilege RBAC.
#
# WHY THIS FILE EXISTS: the Weirvern CLI reads cluster state to show
# service health (`weirvern status`). That needs an identity
# with `get`/`list` on a narrow set of resources — not cluster-admin, and not an
# operator's personal kubeconfig with full rights.
#
# Create a kubeconfig for the control plane from this ServiceAccount token:
#
#     kubectl -n weirvern create token weirvern-viewer --duration=24h
#
# Two roles, deliberately separate:
#   * viewer  — read-only. This is what `weirvern status` uses by default.
#   * operator — adds the lifecycle verbs (scale, rollout restart). Assign it
#     only to a human who is allowed to stop the pipeline, not to a monitoring
#     process.
#
# Note what is NOT granted anywhere: secrets. The status tooling does not read
# the Pushover token, so an account that displays health cannot exfiltrate the
# alert credentials.
#
# EXCEPTION, stated because the previous version of this comment overstated it:
# `weirvern install` DOES read the secret, to verify the Pushover keys are
# present before you rely on alerting. Under the viewer role that check cannot
# complete, and cmd_install reports it as "cannot read (RBAC)" rather than as a
# missing credential — a permission failure and a configuration failure are
# different problems and must not be conflated. Use the operator kubeconfig, or
# grant a narrow `get` on this one secret, if you want the install check to
# verify credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirvern-viewer
  namespace: weirvern
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirvern-operator
  namespace: weirvern
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weirvern-viewer
  namespace: weirvern
rules:
  # Read pod and workload state for the health panel.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  # Logs: `weirvern logs` reads these. Bounded to this namespace.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weirvern-operator
  namespace: weirvern
rules:
  # ── WHAT THE OPERATOR ROLE MAY REACH, AND WHY IT IS NARROWER THAN IT LOOKS ─────────────────
  #
  # AUDIT F017, CONFIRMED AGAINST A LIVE CLUSTER. This role granted patch/update on the WHOLE
  # `daemonsets` resource. Measured with a server-side dry run, the GUI's ServiceAccount could
  # rewrite the zeek DaemonSet -- which is `privileged: true`, holds CAP_NET_RAW, and mounts host
  # paths:

  #     kubectl patch ds/zeek --as=system:serviceaccount:<ns>:weirvern-operator \
  #       -p '{"spec":{"template":{"spec":{"volumes":[{"name":"host-root",
  #            "hostPath":{"path":"/"}}]}}}}' --dry-run=server
  #     -> daemonset.apps/zeek patched
  #
  # The only objection was a PodSecurity WARNING. The namespace is labelled
  # `pod-security.kubernetes.io/enforce: privileged`, so nothing enforces it -- and that label is
  # deliberate, because the capture sensor genuinely needs those capabilities. The consequence:
  # a compromised GUI pod could mount the node filesystem on every node. The GUI is a NodePort
  # HTTP service with password auth, so "a compromised GUI pod" is not hypothetical.
  #
  # THE GRANT IS NOW SCOPED BY NAME. `resourceNames` is verified live to work per object:
  #
  #     with resourceNames=[zeek]:  patch daemonsets/zeek -> yes
  #                                 patch daemonsets/clickhouse -> no
  #
  # The GUI's settings path restarts exactly two workloads (`_RESTART_FOR` in
  # admin/cluster_config.py) plus itself, so those three names are the whole of what it needs.
  # `update` is still NOT granted anywhere: a PUT replaces the entire object, so one malformed
  # request could strip a workload's securityContext.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  # The restart path, name-scoped. Each entry is one workload the settings UI may roll.
  #
  # THEY ARE SEPARATE RULES ON PURPOSE: a single rule listing all three `resourceNames` would also
  # need a single verb set, and keeping them apart means the reason for each is visible and a
  # future addition has to be deliberate.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["zeek"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["weirvern-worker", "weirvern-gui"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  # The Sonar survey Job. THE ONE GRANT THAT CANNOT BE NAMED: the job is created with a random
  # suffix (`weirvern-sonar-<8 hex>` in admin/sonar.py) so concurrent surveys do not collide, and
  # `resourceNames` cannot match a name that does not exist yet. `create` therefore has to be
  # broad within this namespace.
  #
  # The blast radius is bounded by what a Job CAN do here rather than by its name: it runs the
  # weirvern-worker image, which the cluster already trusts, and it does not inherit the operator
  # ServiceAccount. An operator who wants it tighter can drop `create` and run surveys from the CLI
  # instead -- the GUI reports that cleanly rather than failing oddly.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/portforward"]
    verbs: ["get", "create"]
  # THE CONFIG WRITE PATH. The GUI patches weirvern-env to change settings, and rolls the
  # workload that reads it. Scoped to this namespace (this is a Role, not a ClusterRole), so the
  # grant cannot reach another namespace’s configuration.
  #
  # `patch` on configmaps is the whole of what a settings change needs. `update` is deliberately
  # NOT granted: a PUT replaces every key, which would wipe values the GUI never showed.
  #
  # `create` is here for ONE object: the account store (`weirvern-users`), which the GUI creates
  # on first startup rather than shipping as a manifest. A placeholder manifest would be
  # re-applied with empty values on every `kubectl apply -k`, silently wiping live accounts --
  # the same failure mode the Secret has a note about in kustomization.yaml. The grant is
  # namespace-scoped like everything else here, so a compromised GUI pod cannot create
  # ConfigMaps anywhere else.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weirvern-viewer
  namespace: weirvern
subjects:
  - kind: ServiceAccount
    name: weirvern-viewer
    namespace: weirvern
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weirvern-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weirvern-operator
  namespace: weirvern
subjects:
  - kind: ServiceAccount
    name: weirvern-operator
    namespace: weirvern
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weirvern-operator
