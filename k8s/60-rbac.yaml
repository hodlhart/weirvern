# Least-privilege RBAC.
#
# WHY THIS FILE EXISTS: the Weirvern CLI and TUI read cluster state to show
# service health (`weirvern status`, `weirvern tui`). That needs an identity
# with `get`/`list` on a narrow set of resources — not cluster-admin, and not an
# operator's personal kubeconfig with full rights.
#
# Create a kubeconfig for the control plane from this ServiceAccount token:
#
#     kubectl -n weirvern create token weirvern-viewer --duration=24h
#
# Two roles, deliberately separate:
#   * viewer  — read-only. This is what the TUI uses by default.
#   * operator — adds the lifecycle verbs (scale, rollout restart). Assign it
#     only to a human who is allowed to stop the pipeline, not to a monitoring
#     process.
#
# Note what is NOT granted anywhere: secrets. The status tooling does not read
# the Pushover token, so an account that displays health cannot exfiltrate the
# alert credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirvern-viewer
  namespace: weirvern
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirvern-operator
  namespace: weirvern
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weirvern-viewer
  namespace: weirvern
rules:
  # Read pod and workload state for the health panel.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  # Logs: the TUI's log pane reads these. Bounded to this namespace.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weirvern-operator
  namespace: weirvern
rules:
  # Everything a viewer can do, plus lifecycle control. `scale` is how
  # `weirvern stop`/`start` works against a cluster — see K8sBackend.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/portforward"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weirvern-viewer
  namespace: weirvern
subjects:
  - kind: ServiceAccount
    name: weirvern-viewer
    namespace: weirvern
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weirvern-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weirvern-operator
  namespace: weirvern
subjects:
  - kind: ServiceAccount
    name: weirvern-operator
    namespace: weirvern
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weirvern-operator
