# Zeek local configuration — Weirvern second sensor.
#
# Zeek is the packet-level sensor: NetFlow/sFlow gives volume and topology,
# while Zeek gives protocol behaviour (DNS, TLS/JA3, HTTP, file transfers) that
# flow records structurally cannot express. A slow port scan and a
# DNS-tunnelling or JA3-tagged C2 channel all look like ordinary byte counts in
# NetFlow; Zeek sees them as connection and protocol records.
#
# This file is mounted into the container at /usr/local/zeek/spool/zeekctl.cfg
# (see k8s/32-zeek.yaml, configMapGenerator) and only sets the non-default bits.

# Write logs as TSV, a line per record — the same shape the Weirvern ingester
# already parses for goflow2 JSONL, just a different column set.
@load tuning/json-logs

# Keep log volume sane on a home-lab box: rotate hourly and keep a day.
LogRotationInterval = 3600
LogExpireInterval = 24hr

# Do not phone home from a homelab sensor.
SitePolicyStandalone = T

# Use the system's local timezone for log timestamps (matches ClickHouse TZ).
TimeMachineHostName = localhost

# Drop the more verbose logs we do not consume, to cut disk churn.
# (conn/dns/ssl/http/files/notice are what Weirvern ingests.)
@load misc/trim-stats
