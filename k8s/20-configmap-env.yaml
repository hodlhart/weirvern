# Environment for every Weirvern workload.
#
# These are the NON-SECRET settings, mirroring .env.example. The values are
# read by weirvern/config.py with the same names as the .env file, so a local
# run and a cluster run are configured identically.
#
# Secrets (PUSHOVER_* credentials, CLICKHOUSE_PASSWORD) do NOT belong here — a
# ConfigMap is not confidential. They live in a Secret that is created out of
# band by the operator, deliberately NOT managed by kustomize; see the SECRETS
# block in k8s/kustomization.yaml and step 4 of the README.
apiVersion: v1
kind: ConfigMap
metadata:
  name: weirvern-env
  namespace: weirvern
data:
  # ── ClickHouse ─────────────────────────────────────────────────────────────
  # The Service name below resolves in-cluster, so no NodePort is required for
  # pod-to-pod traffic.
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: "weirvern"
  # MUST NOT BE "default".
  #
  # The official ClickHouse entrypoint locks the `default` user to localhost
  # unless a NON-default user (or a non-empty password) is configured, so other
  # pods are refused by a network filter and the error misleadingly blames the
  # password ("Authentication failed: password is incorrect, or there is no user
  # with such name"). Reading the entrypoint, the condition is:
  #
  #   if (CLICKHOUSE_USER is set AND != "default") OR (CLICKHOUSE_PASSWORD
  #      is non-empty) OR (CLICKHOUSE_ACCESS_MANAGEMENT != 0)
  #       -> generate that user with <networks><ip>::/0</ip></networks>
  #          and remove `default`
  #   else
  #       -> "disabling network access for user 'default'"
  #
  # So with USER=default and an empty password the database is unreachable from
  # any other pod. That is what shipped, and it is why the worker and schema Job
  # retried forever while `kubectl exec` into the pod worked (source 127.0.0.1).
  # This is a named user for that reason, and the password in the Secret must be
  # non-empty (see the SECRETS note in k8s/kustomization.yaml).
  CLICKHOUSE_USER: "weirvern"
  TZ: "America/Chicago"

  # ── Collector ──────────────────────────────────────────────────────────────
  # The sensor listen ports are NOT ConfigMap settings (review round 2026-10-15): they
  # are literals in 31-goflow2.yaml (the -listen string, the containerPort, and the
  # Service's nodePort 32055/32063) and install.sh prints those same literals. These two
  # keys used to sit here reading like switches while nothing consumed them -- changing
  # them moved NOTHING. To move a port, edit 31-goflow2.yaml and install.sh together;
  # there is no knob, and now there is no fake knob.

  # ── Sensors ────────────────────────────────────────────────────────────────
  # TWO INTERFACES, TWO JOBS. This is the shape that works:
  #
  #   ZEEK_IFACE   the CAPTURE port: a dedicated NIC receiving a switch SPAN/mirror
  #                feed, or a passive TAP. It must NOT carry the default route and
  #                must NOT be a bridge member.
  #   MGMT_IFACE   the MANAGEMENT port: normal networking, default route, SSH and
  #                the cluster API. Not sniffed.
  #
  # A mirror port receives copies of OTHER hosts' traffic. The management port only
  # ever sees traffic to and from this host plus broadcast noise, so pointing
  # ZEEK_IFACE at it produces a capture that looks busy and contains no network
  # view -- measured at 73% broadcast/multicast on a real deployment.
  #
  # List what this node actually has, and get a verdict, with:
  #     weirvern interfaces --node <sensor-node>
  #
  # ── THESE ARE PLACEHOLDERS, AND NOTHING DETECTS THAT ────────────────────────────────────────
  #
  # eth1/eth0 are the conventional Ubuntu names, not a discovery. On a node whose NICs are
  # ens18/ens19 (the common Proxmox/KVM shape) these names DO NOT EXIST, and the sensor refuses
  # to start: "FATAL: interface 'eth1' does not exist on this node", CrashLoopBackOff.
  #
  # The installer replaces them with the interfaces it detected -- by WRITING THIS FILE, so the
  # file is authoritative after an install, and `kubectl apply -k k8s/` from an un-installed
  # checkout puts the placeholders back. That revert happened here during testing and took the
  # sensor down. MEASURED, not hypothetical. If that happens, restore the real names:
  #
  #     kubectl -n weirvern patch cm weirvern-env --type merge \
  #       -p '{"data":{"ZEEK_IFACE":"<capture>","MGMT_IFACE":"<mgmt>"}}'
  #     kubectl -n weirvern rollout restart ds/zeek
  ZEEK_IFACE: "eth1"
  MGMT_IFACE: "eth0"
  ZEEK_LOG_DIR: "/zeek/logs"
  TAIL_FILE: "/data/flows.jsonl"

  # ── Tail cursor checkpoints ────────────────────────────────────────────────
  # Where the ingester records how far it has read each tailed log, so a restart
  # resumes instead of re-reading the file from the beginning and duplicating
  # every row into `flows` (which the detectors then baseline against).
  #
  # `/models` and NOT the tailed file's own directory: /data and /zeek/logs are
  # mounted READ-ONLY here by design, so a cursor written beside the log silently
  # fails to save and the restart re-reads everything. The models volume is the
  # one writable PERSISTENT mount the worker already has.
  TAIL_STATE_DIR: "/models"

  # ── Reverse DNS (display names in the GUI) ─────────────────────────────────
  # How the web UI labels addresses. Read by the GUI process at startup (it does the
  # lookups), so a change restarts deploy/weirvern-gui.
  #   private  resolve only private/link-local/CGNAT addresses. Lookups stay on your
  #            network. This is the default.
  #   all      also resolve PUBLIC addresses: every external destination in your flow
  #            data is sent to a DNS resolver, which leaks what you talk to. An
  #            operator's explicit decision, never a default.
  #   off      no lookups; addresses display without names.
  # This key lives HERE and not in the GUI's own `env:` list: an env entry shadows
  # envFrom, so a pin in the deployment made the Settings write inert while the panel
  # reported it saved (live-measured).
  WEIRVERN_REVERSE_DNS: "private"

  # ── Active asset scanner (Nmap + Nuclei) ──────────────────────────────────
  # THE SCAN SCOPE COMES FROM THE WEIRLING REGISTRY. Every enabled, non-revoked weirling
  # contributes its explicit `networks` list; rows that predate that column fall back to a
  # CIDR-valued `segment` and `plan_segment`. There is deliberately no second, hand-maintained
  # CIDR list here: a network is monitored because a weirling says it covers it.
  #
  # Scanner OFF by default; set SCAN_ENABLED=1 in the cluster. A deployment with no weirling
  # CIDRs logs that fact and scans nothing rather than guessing an RFC1918 range.
  #
  # SCAN_BOOTSTRAP=1 seeds the inventory on the first empty-registry pass. After that the
  # registry is non-empty, so restarts scan only genuinely new hosts. New hosts are queued and
  # scanned in the same pass.
  SCAN_ENABLED: "0"
  # NUCLEI IS OFF. Identity is Nmap -sV plus safe NSE scripts; no template tree or update
  # lifecycle is required for the scanner to be useful on any network.
  SCAN_NUCLEI_ENABLED: "0"
  SCAN_INTERVAL_S: "60"
  # Passive detection runs every loop (a ClickHouse read, no packets). The active Nmap sweep
  # runs on this slower schedule; a two-/24 sweep every 60s was ~30k probes/hour for no new hosts.
  SCAN_DISCOVERY_S: "300"
  SCAN_PASSIVE_MINUTES: "10"
  SCAN_RESCAN_S: "3600"
  SCAN_JOB_LEASE_S: "900"
  SCAN_BOOTSTRAP: "0"
  SCAN_PORTS: "1-1024,3000,5000,8000-9000,9090,9443"
  SCAN_TIMEOUT_S: "600"
  SCAN_MAX_HOSTS: "16"
  SCAN_NUCLEI_SEVERITY: "critical,high,medium"
  SCAN_NUCLEI_TEMPLATES: "/opt/nuclei-templates"
  # DESTRUCTIVE TEMPLATES ARE EXCLUDED EXPLICITLY, not just by severity. CVE-2019-5544
  # (VMware OpenSLP) is a DoS template that sends a heap-overflow payload; it must never run
  # against a home appliance. `dos`, `intrusive`, `fuzz`, `brute-force`, `headless` and `code`
  # are all opt-in classes, never default inventory work.
  SCAN_NUCLEI_EXCLUDE_TAGS: "dos,intrusive,fuzz,brute-force,headless,code"
  SCAN_NUCLEI_EXCLUDE_IDS: "CVE-2019-5544"
  SCAN_NUCLEI_TAGS: ""
  SCAN_NUCLEI_CONCURRENCY: "25"
  SCAN_NUCLEI_BULK_SIZE: "25"
  SCAN_NUCLEI_RATE_LIMIT: "150"
  SCAN_NUCLEI_TIMEOUT_S: "10"
  SCAN_NUCLEI_RETRIES: "1"
  SCAN_NUCLEI_MAX_HOST_ERROR: "5"
  SCAN_NUCLEI_RESPONSE_SIZE: "1048576"
  SCAN_NUCLEI_NO_INTERACTSH: "1"

  # ── Sensor mode ────────────────────────────────────────────────────────────
  # HOW the sensor gets its packets. Named for the creature: a wyvern keeps its
  # water in a LOCH and draws it through a SIPHON.
  #   loch  passive — still water. A promiscuous NIC fed by a SPAN/mirror port or
  #         TAP. Weirvern observes only; a dead sensor is a visibility gap.
  #   siphon  in-path — a conduit the water is drawn through. ARP-spoof and relay
  #         selected hosts through Weirvern. No switch change needed, but Weirvern
  #         becomes a router and a dead sensor is an OUTAGE for those hosts.
  #         Requires CAP_NET_ADMIN, three sysctls on the node, and the fail-open
  #         watchdog.
  # Inspect a mode's requirements before enabling it:  weirvern mode siphon
  SENSOR_MODE: "loch"
  # siphon mode only: who to intercept (comma-separated addresses/CIDRs, or "*").
  # EMPTY MEANS NOTHING IS INTERCEPTED — enabling the mode diverts no traffic by
  # itself. Never list the management gateway, this sensor, the API server, or DNS.
  INTERCEPT_TARGETS: ""

  # ── TRAFFIC EXCLUSION ────────────────────────────────────────────────
  #
  # Addresses the sensor refuses to LEARN from. A scanner sweeping the VLAN is a picture of the
  # scanner, not the network: every address a "new" destination, every port a "new" service, and
  # the baseline the detectors learn from is swamped.
  #
  # APPLIED AT THE ROW LAYER, so the record is COUNTED and dropped rather than never existing.
  # That keeps the evidence available for a manual look, and the count is reported so a smaller
  # total is explained instead of inferred.
  #
  # Separate from WEIRVERN_CAPTURE_EXCLUDE_CIDRS below because this one is reversible: the traffic
  # still reaches the sensor and could be re-ingested later.
  #
  # The DEFAULTS (compiled in, not listed here) cover the cluster's own plumbing: 10.42.0.0/16 pod
  # CIDR, 198.51.100.0/16 service CIDR, 172.17.0.0/16 docker bridge, link-local, multicast and
  # broadcast. They deliberately do NOT include RFC1918 generally -- a sensor watching a 10.x or
  # 192.168.x network would otherwise go blind to the traffic it exists for.
  WEIRVERN_EXCLUDE_CIDRS: ""

  # Addresses dropped at the CAPTURE SOCKET, before Zeek writes anything.
  #
  # EMPTY BY DEFAULT, and deliberately not derived from the list above. This is IRREVERSIBLE: the
  # packet is discarded, so no log line is written and nothing can be re-examined afterwards. Right
  # for genuinely worthless traffic; wrong for anything you might later want evidence about.
  #
  # Values are CIDRs or addresses (a bare address is treated as a single host). IPv6 is refused
  # here -- a v4-shaped BPF term for a v6 network matches nothing and yields an empty-but-healthy
  # capture -- so use WEIRVERN_EXCLUDE_CIDRS for IPv6.
  WEIRVERN_CAPTURE_EXCLUDE_CIDRS: ""

  # ── In-path intercept (siphon mode only) ─────────────────────────────────────
  #
  # THE REST OF THE INTERCEPT PLAN, so that enabling siphon mode does not require
  # hand-passing four flags to a command inside a pod every time.
  #
  # These were read by the CLI (`weirvern intercept` falls back to INTERCEPT_SEGMENT,
  # INTERCEPT_ADDR, INTERCEPT_GATEWAY) and were present in .env.example, but NOT here —
  # so a cluster deployment had no way to set them except the command line. Measured:
  # the deployed pod had all four empty, and `weirvern intercept` with no flags reports
  # "missing: segment, our address, gateway".
  #
  # ALL THREE ARE EMPTY BY DEFAULT, which is the safe state: an empty segment means
  # preflight cannot pass, so siphon mode refuses to start rather than guessing a range.
  # Guessing here would mean poisoning hosts the operator never chose.
  #
  #   INTERCEPT_SEGMENT   the CIDR whose traffic to relay, e.g. 198.51.100.0/24. This IS
  #                       the blast radius: every host in it would have its ARP cache
  #                       forged, so it is listed explicitly rather than derived from
  #                       the interface.
  #   INTERCEPT_ADDR      this sensor's own address ON THAT SEGMENT. It must be an
  #                       address nothing else uses; `weirvern intercept` can find a
  #                       free one and verify it, which is why the default is empty
  #                       rather than a plausible-looking guess.
  #   INTERCEPT_GATEWAY   the gateway whose traffic is relayed. Required for the
  #                       one-armed-router policy route, without which relayed packets
  #                       leave by the management interface and are dropped as martians.
  #
  # Set these together or not at all; a partial set fails preflight with a specific
  # missing-item list rather than a partial intercept.
  INTERCEPT_SEGMENT: ""
  INTERCEPT_ADDR: ""
  INTERCEPT_GATEWAY: ""

  # ── Detection loop ─────────────────────────────────────────────────────────
  DETECT_INTERVAL_S: "300"
  RETRAIN_EVERY_H: "6"
  RETRAIN_WINDOW_H: "72"
  BASE_THRESHOLD: "0.35"
  MIN_AGREEMENT: "0.33"
  # The corroboration bar: a detector scoring at/above this counts as a STRONG
  # signal, and high/critical severity needs two-or-more (or one plus a
  # structural signature). Editable from the GUI. It was editable BEFORE the
  # worker actually read it -- the edit validated, the worker restarted, and the
  # behaviour was identical, which is the silent no-op this comment exists to
  # prevent recurring.
  STRONG_SIGNAL: "0.85"

  # ── Alerting ───────────────────────────────────────────────────────────────
  # PUSHOVER_ENABLED is the master switch for real push delivery, and it MUST be
  # set here: the key was previously absent, so config.py defaulted it to False
  # and the deployment could never send an alert — it detected anomalies and
  # silently logged them. For an alerting system that is the worst possible
  # failure shape, and it was invisible in every health check.
  #
  # Leave it at "0" for a first run (log-only), then set "1" once the secret
  # exists. Note config.validate(): with this ON, empty credentials are a HARD
  # startup failure, which is the honest behaviour — better to crash loudly than
  # to run believing alerts are being delivered.
  PUSHOVER_ENABLED: "0"

  # ── Sluice Gate: operator-controlled blocking ──────────────────────────────────────────
  #
  # OFF BY DEFAULT, and that is a deliberate choice about what kind of tool this is. Weirvern is a
  # monitoring appliance first: installing it should not start blocking traffic before anyone has
  # looked at what it sees. An operator opens the gate when they have a reason to.
  SLUICE_ENABLED: "0"

  # The interface enforcement attaches to. Empty means the capture interface, which is right for an
  # in-path deployment. It can NEVER be the management interface: the gate refuses that at
  # authoring time with a sentence, because blocking there cuts off whoever administers this box.
  # CHANNEL: an IN-LINE weirling -- CHANNEL_UPSTREAM faces the network, CHANNEL_DOWNSTREAM faces
  # the protected device, both enslaved to one bridge. A verified, live channel lets the Sluice
  # Gate enforce real blocks while SENSOR_MODE stays loch (nothing forged, nothing redirected).
  # Empty (the default) = no channel; the gate reports that plainly rather than guessing.
  CHANNEL_UPSTREAM: ""
  CHANNEL_DOWNSTREAM: ""
  # Whether the traffic crossing the in-line channel becomes Netflow records: off | upstream |
  # downstream (which port the flow probe samples). Only runs while the channel is active.
  CHANNEL_NETFLOW: "off"

  # Whether a LIVE siphon intercept becomes a flow source too: 1 | 0. The sensor's own interface is
  # metered the same way the channel's ports are (bounded segments -> IPFIX -> the same `flows`
  # table), only while the intercept is VERIFIED live, and it yields to CHANNEL_NETFLOW on a box
  # doing both -- two taps would count every conversation twice.
  SIPHON_NETFLOW: "0"

  SLUICE_IFACE: ""

  # Whether DETECTIONS may block on their own: off | high | medium | strict. Defaults to off even
  # when the gate is enabled, because auto-blocking on model output is a decision an operator makes
  # having seen what the ensemble calls high severity on their own network. See
  # weirvern/sluice.py CRITICALITY_POLICIES for what each level does and what it costs.
  SLUICE_CRITICALITY: "off"

  # A CEILING on the policy's own TTL, in seconds. An operator who distrusts automated blocking can
  # set this low and keep the convenience: "block for a minute, tell me, and let me look".
  SLUICE_MAX_BLOCK_S: "3600"

  # How often the gate re-arms. Also the interval within which a LAPSED rule stops being enforced,
  # since expiry is re-evaluated on every pass. Compiling a ruleset is milliseconds, so short is cheap.
  SLUICE_INTERVAL_S: "60"
  PUSHOVER_COOLDOWN_S: "1800"
  PUSHOVER_MAX_PER_HOUR: "20"

  # ── Disk caps ────────────────────────────────────────────────────────────
  # Ceilings for each growing component. Zeek rotates hourly and deletes NOTHING,
  # so without a cap the sensor fills its disk, stops capturing, and takes
  # ClickHouse down with it -- which presents as a database fault rather than a
  # capacity one. Run `weirvern disk` for values sized to the host.
  #
  # Enforced by the weirvern-prune CronJob (35-prune-cronjob.yaml), not by the
  # sensor: the zeek image has no python3, and the worker mounts the log
  # directory read-only on purpose.
  #
  # 0 means "no cap" and is reported as unset, never as "within budget".
  ZEEK_MAX_MB: "2048"
  NETFLOW_MAX_MB: "1024"
  ML_MAX_MB: "2048"

  # ── Models ─────────────────────────────────────────────────────────────────
  MODEL_DIR: "/models"
