# The mTLS weirling ingest edge.
#
# This overlay is the OPTIONAL cert-manager path. The default installer creates the CA and
# server certificate with scripts/bootstrap-mtls.sh and the gateway is part of the base
# kustomization, so a fresh deployment does not depend on cert-manager. Keep this overlay for
# sites that already run cert-manager and want Certificate objects to manage renewal.
namespace: weirvern
resources:
  - certificate.yaml
  - gateway.yaml
