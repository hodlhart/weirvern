# Zeek packet sensor — the second, independent view of the network.
#
# WHY A DAEMONSET WITH hostNetwork, and why this is the right model:
#
#   A packet sniffer can only see traffic on the interface it is attached to.
#   That is a property of the NODE, not of a pod — so the correct Kubernetes
#   abstraction is one Zeek per node (DaemonSet), attached to the host's network
#   namespace (hostNetwork: true) with the raw-socket capability (NET_RAW).
#   Running a sniffer inside a single host's network namespace has no
#   cluster-level equivalent and no answer for "which node?".
#
# NODE SELECTION: by default this runs on every node, which is wrong for most
# clusters (you rarely want Zeek sniffing the control plane). Restrict it with a
# label; the sensor node is the one carrying the mirrored/span traffic:
#
#     kubectl label node <node> weirvern.io/sensor-node=true
#
#   then uncomment the nodeSelector below. The default is therefore a DaemonSet
#   that will run everywhere until you constrain it — deliberately visible
#   rather than silently scoped to a node that may not exist.
#
# SECURITY POSTURE (this is the most privileged workload in the project):
#   * hostNetwork + NET_RAW are the minimum needed to capture packets. There is
#     no way to sniff without them.
#   * NET_ADMIN is NOT granted. It was needed in the single-host setup only for
#     optional interface tuning; here the interface must already exist and be
#     up, and Zeek does not reconfigure it.
#   * The container does not run as root (uid 10001) and drops all other
#     capabilities.
#   * The logs it writes are the only thing mounted from the host, and they are
#     written to a hostPath the worker reads.
#
# PRIVACY: Zeek's http.log and dns.log contain personal data (hostnames, URLs,
# user agents, and — with capture_password enabled — credentials). Keep
# capture_password OFF (it is off by default and Weirvern never enables it).
# See USAGE_POLICY.md before enabling additional log types.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zeek
  namespace: weirvern
  labels:
    app.kubernetes.io/name: zeek
    app.kubernetes.io/part-of: weirvern
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zeek
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeek
        app.kubernetes.io/part-of: weirvern
    spec:
      # Uncomment to confine the sensor to one node. See the note above.
      # nodeSelector:
      #   weirvern.io/sensor-node: "true"
      # TOLERATIONS: a DaemonSet runs on every node the selector matches, but a
      # node with a taint is skipped entirely UNLESS the pod tolerates it. This
      # matters most for the single-node case, which is the most common homelab
      # shape: on a one-node kubeadm cluster the only node carries
      # `node-role.kubernetes.io/control-plane:NoSchedule`, so without the
      # toleration below the Zeek pod stays Pending forever and packet capture
      # never starts — while everything else looks healthy.
      #
      # Left commented out deliberately: tolerating the control-plane taint means
      # a PRIVILEGED packet sniffer may run on control-plane nodes in a
      # multi-node cluster. That is a placement decision, not a default.
      # Uncomment for a single-node cluster; k3s/k0s usually need nothing here
      # because they do not taint the control plane by default.
      # tolerations:
      #   - key: node-role.kubernetes.io/control-plane
      #     operator: Exists
      #     effect: NoSchedule
      hostNetwork: true
      # Zeek writes to a hostPath, and DNS resolution inside Zeek benefits from
      # the node's resolver rather than the cluster's, which would send every
      # reverse lookup to CoreDNS.
      dnsPolicy: ClusterFirstWithHostNet
      # The pod must survive eviction pressure on a busy sensor node: capture
      # loss makes the anomaly baseline wrong, which is worse than the memory it
      # costs to keep it resident.
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        # The POD-level uid is deliberately NOT set here: the zeek container must
        # run as root for NET_RAW to survive (see its securityContext for the
        # verified reason), while the pod-level fsGroup is still useful for the
        # log volume. Setting runAsUser here would be inherited by the container
        # and silently reintroduce the capture failure.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: zeek
          # DERIVED image, not upstream: it carries the JA4 module vendored at
          # zeek/vendor/ja4-zeek-scripts. The site policy @loads that module, so on the
          # plain upstream image Zeek aborts with "failed to locate script" and the
          # sensor never sniffs. See zeek/Containerfile, which must be built and pushed
          # before this is applied.
          #
          # The module is baked in at build time rather than installed at container
          # start: the deployment must not depend on a fetch to come up.
          image: weirvern-zeek:0.5.0
          # Run Zeek in the foreground on the chosen interface. `-C` disables
          # checksum validation, which is required when traffic arrives via a
          # mirror/SPAN port where the NIC has already validated it.
          #
          # HOW THE SITE POLICY IS LOADED — verified against Zeek's own source
          # (src/Options.cc:665-678): after the flags are parsed, each remaining
          # argument is classified —
          #   contains "="   -> a variable assignment (a `redef`), and an UNKNOWN
          #                     identifier is a FATAL error ("unknown identifier
          #                     '%s' in command-line options")
          #   contains "::"  -> a plugin to activate
          #   otherwise      -> a SCRIPT TO LOAD
          #
          # So the policy file is passed as a BARE PATH. An earlier version passed
          # `SitePolicyFile=/zeek/site/weirvern-local.zeek`, which is not a Zeek
          # identifier at all (grep of the entire Zeek tree: zero hits) — so Zeek
          # aborted during argument processing and the sensor never sniffed.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              IFACE="${ZEEK_IFACE:-eth0}"
              # MULTIPLE CAPTURE PORTS (operator, 2026-10-19): ZEEK_IFACES is a comma-separated
              # list (eth1,eth2). Empty means just ZEEK_IFACE, so every existing deployment is
              # unchanged. Zeek accepts repeated -i and merges both streams into one capture.
              IFARGS=""
              for one in $(printf '%s' "${ZEEK_IFACES:-$IFACE}" | tr ',' ' '); do
                [ -n "$one" ] || continue
                IFARGS="$IFARGS -i $one"
              done
              [ -n "$IFARGS" ] || IFARGS="-i $IFACE"
              MGMT="${MGMT_IFACE:-}"
              MODE="${SENSOR_MODE:-loch}"
              # ── WHICH MODE ARE WE IN, AND WHAT DOES IT COST IF WE FAIL? ──────
              #
              # The mode decides whether this sensor is a passive observer or a
              # ROUTER. Both are valid; the consequences are not comparable, and an
              # operator should not have to infer which one they are running from a
              # config file. So it is stated at startup, every time, with the failure
              # mode attached -- the same reason the interface warnings below exist.
              case "$MODE" in
                loch)
                  echo "[zeek] mode loch — PASSIVE capture on $IFACE."
                  echo "[zeek] mode loch — Weirvern observes only; it cannot affect traffic."
                  ;;
                siphon|weir)  # weir = the former name, accepted so a pre-rename config boots
                  if [ "$MODE" != "siphon" ]; then
                    echo "[zeek] note: SENSOR_MODE='$MODE' is the former name of 'siphon';" >&2
                    echo "[zeek] note: update it in the ConfigMap when convenient." >&2
                  fi
                  echo "[zeek] mode siphon — IN-PATH intercept on $IFACE."
                  echo "[zeek] mode siphon — traffic is relayed THROUGH this container." >&2
                  echo "[zeek] mode siphon — if it stops forwarding, intercepted hosts lose" >&2
                  echo "[zeek] mode siphon — the network until their ARP entries expire." >&2
                  # Verify the pieces siphon mode depends on, and refuse to pretend:
                  # intercepting without the ability to forward takes the LAN down,
                  # which is strictly worse than not starting.
                  if [ "$(cat /proc/sys/net/ipv4/ip_forward 2>/dev/null || echo 0)" != "1" ]; then
                    echo "[zeek] FATAL: mode siphon requires net.ipv4.ip_forward=1." >&2
                    echo "[zeek] FATAL: Without it the intercepted traffic is dropped," >&2
                    echo "[zeek] FATAL: which is an outage for the intercepted hosts." >&2
                    exit 1
                  fi
                  if [ "$(cat /proc/sys/net/ipv4/conf/all/rp_filter 2>/dev/null || echo 1)" != "0" ]; then
                    echo "[zeek] FATAL: mode siphon requires net.ipv4.conf.all.rp_filter=0." >&2
                    echo "[zeek] FATAL: Reverse-path filtering would drop the relayed" >&2
                    echo "[zeek] FATAL: packets because their source is not ours." >&2
                    exit 1
                  fi
                  if [ "$(cat /proc/sys/net/ipv4/conf/all/send_redirects 2>/dev/null || echo 1)" != "0" ]; then
                    echo "[zeek] FATAL: mode siphon requires send_redirects=0." >&2
                    echo "[zeek] FATAL: ICMP redirects would tell intercepted hosts to" >&2
                    echo "[zeek] FATAL: send directly, silently undoing the intercept." >&2
                    exit 1
                  fi
                  ;;
                *)
                  echo "[zeek] FATAL: unknown SENSOR_MODE '$MODE'." >&2
                  echo "[zeek] FATAL: expected 'loch' (passive) or 'siphon' (in-path)." >&2
                  exit 1
                  ;;
              esac
              # Interface existence check WITHOUT `ip`.
              #
              # `ip` is not in the zeek/zeek image (verified: the guard below ran
              # and reported "/bin/sh: ip: not found"), so the check itself failed
              # in a way that looked like the interface was missing. Use the same
              # sysfs view the kernel exposes, which is always present:
              #   /sys/class/net/<iface>  exists iff the interface exists.
              # It also needs no privileges beyond what the container already has.
              if [ ! -e "/sys/class/net/$IFACE" ]; then
                echo "[zeek] FATAL: interface '$IFACE' does not exist on this node." >&2
                echo "[zeek]" >&2
                echo "[zeek] Weirvern uses TWO interfaces:" >&2
                echo "[zeek]   ZEEK_IFACE  the CAPTURE port - a dedicated NIC fed by a" >&2
                echo "[zeek]               switch SPAN/mirror port or a passive TAP" >&2
                echo "[zeek]   MGMT_IFACE  the MANAGEMENT port - default route, SSH, API" >&2
                echo "[zeek]" >&2
                echo "[zeek] Interfaces that exist on THIS node:" >&2
                for d in /sys/class/net/*; do
                  n=$(basename "$d")
                  [ "$n" = "lo" ] && continue
                  extra=""
                  [ -e "$d/brport" ] && extra=" (bridge member - cannot capture)"
                  printf '[zeek]   %-14s %s%s\n' "$n" "$(cat "$d/operstate" 2>/dev/null || echo '?')" "$extra" >&2
                done
                echo "[zeek]" >&2
                echo "[zeek] If you have not added the mirror NIC yet, set ZEEK_IFACE to" >&2
                echo "[zeek] an existing interface in k8s/20-configmap-env.yaml. Note that" >&2
                echo "[zeek] capturing on the management port sees only this host's own" >&2
                echo "[zeek] traffic plus broadcast, NOT the network - an L7 view of the" >&2
                echo "[zeek] LAN needs a real mirror/SPAN port." >&2
                echo "[zeek] Analyse this node:  weirvern interfaces --node <this-node>" >&2
                exit 1
              fi
              # ── IS THIS ACTUALLY A MIRROR PORT? ─────────────────────────────
              #
              # The failure this guards is SILENT. Zeek will happily sniff a bridge
              # member or the management NIC, produce a healthy-looking capture, and
              # show you almost none of the network. We measured a real deployment
              # where the sensor sat on a bridge member inside a container: 73% of
              # what it captured was broadcast and multicast, with no unicast from
              # any other host.
              #
              # Two checks, both from sysfs, no extra tools:
              #   /sys/class/net/<if>/brport   exists when ens
              #      a bridge member -> sees only flooded traffic
              #   the interface carrying the default route is the MANAGEMENT port
              #
              # These are WARNINGS, not fatal. A deliberately unusual topology can be
              # valid, and refusing to start would be worse than capturing
              # imperfectly -- but the operator must not have to discover this from a
              # thin log days later. `weirvern interfaces` does the full analysis.
              if [ -e "/sys/class/net/$IFACE/brport" ]; then
                echo "[zeek] WARNING: '$IFACE' is a member of a bridge." >&2
                echo "[zeek] WARNING: A bridge port receives only flooded traffic" >&2
                echo "[zeek] WARNING: (broadcast/multicast) plus traffic to this host." >&2
                echo "[zeek] WARNING: It is NOT a mirror port. Expect very little" >&2
                echo "[zeek] WARNING: unicast from other hosts in these logs." >&2
                echo "[zeek] WARNING: See: weirvern interfaces --node <this-node>" >&2
              fi
              if [ -n "$MGMT" ] && [ "$IFACE" = "$MGMT" ]; then
                echo "[zeek] WARNING: ZEEK_IFACE and MGMT_IFACE are both '$IFACE'." >&2
                echo "[zeek] WARNING: The capture port should be a DEDICATED NIC. On" >&2
                echo "[zeek] WARNING: the management port you will capture this host's" >&2
                echo "[zeek] WARNING: own traffic plus broadcast, not the network." >&2
              else
                # No MGMT_IFACE set: fall back to detecting the default-route port,
                # which is the management port on any normal host. Parsed from
                # /proc/net/route -- the destination column is little-endian hex and
                # a zeroed destination is the default route.
                #
                # POSIX sh only: process substitution (`< <(...)`) is a bashism and
                # would fail in the zeek image's /bin/sh (dash). A plain read loop
                # over the file is portable.
                DEFROUTE=""
                while read -r ifname dest _rest; do
                  if [ "$dest" = "00000000" ]; then DEFROUTE="$ifname"; break; fi
                done < /proc/net/route
                if [ -n "$DEFROUTE" ] && [ "$IFACE" = "$DEFROUTE" ]; then
                  echo "[zeek] WARNING: '$IFACE' carries the default route, so it is the" >&2
                  echo "[zeek] WARNING: MANAGEMENT port. Capturing here sees only this" >&2
                  echo "[zeek] WARNING: host's traffic plus broadcast -- not the network." >&2
                  echo "[zeek] WARNING: Point ZEEK_IFACE at the dedicated mirror port." >&2
                fi
              fi
              # Promiscuous mode is reported, never set: the container deliberately
              # has no NET_ADMIN, so the host must configure it. Saying so here means
              # a capture that looks thin has a stated possible cause.
              #
              # THE ARITHMETIC IS SUBTLE. /sys/class/net/<if>/flags holds a HEX string
              # ("1103"), and shell arithmetic parses bare digits as DECIMAL. So
              # `$(( 1103 & 0x100 ))` computes on decimal 1103, not hex 0x1103, and
              # silently gives the WRONG answer (0 instead of 256) -- which inverted
              # the test in both directions. Two portable options exist and this uses
              # the second:
              #   `$(( 16#$f & 0x100 ))`  -- base-prefix syntax, but it is NOT POSIX
              #                              (verified: dash rejects it with
              #                              "expecting EOF", while busybox/ash accepts)
              #   `$(( 0x$f & 0x100 ))`   -- concatenate the hex prefix onto the
              #                              string and let arithmetic parse the whole
              #                              0x1103 token, which every shell does
              # IFF_PROMISC is bit 8, so the mask is 256 in decimal -- written as
              # 256 rather than 0x100 so no reader mistakes the base.
              if [ -r "/sys/class/net/$IFACE/flags" ]; then
                iflags=$(cat "/sys/class/net/$IFACE/flags" 2>/dev/null || echo 0)
                # Some kernels print the value 0x-prefixed (MEASURED on the LXC test box:
                # "0x1103"). The hex-letter strip below would then see 'x', zero the whole
                # value, and report a promiscuous port as not -- a false alarm. Strip the
                # prefix first. NOTE: `#0[xX]` (two characters) -- `#?` removes only the '0'
                # and leaves the 'x', which is the same bug again.
                case "$iflags" in 0[xX]*) iflags=${iflags#0[xX]} ;; esac
                # Strip anything unusual before use so a malformed value cannot make the
                # arithmetic error out under `set -e` and kill the sensor.
                case "$iflags" in
                  *[!0-9a-fA-F]*) iflags=0 ;;
                esac
                if [ $(( 0x$iflags & 256 )) -eq 0 ]; then
                  echo "[zeek] NOTE: '$IFACE' is not in promiscuous mode. A SPAN port" >&2
                  echo "[zeek] NOTE: usually is. On the node: ip link set $IFACE promisc on" >&2
                fi
              fi
              # Verify CAP_NET_RAW is actually EFFECTIVE before handing control to
              # Zeek. This is the failure that cost the most time to diagnose: with
              # runAsUser != 0, Kubernetes silently drops the added capability, so
              # Zeek dies with "pcap_error: socket: Operation not permitted" and
              # the message reads like a bad interface. Checking here turns a
              # confusing crash loop into one clear line of diagnosis.
              caps=$(grep CapEff /proc/self/status | awk '{print $2}')
              if [ "$caps" = "0000000000000000" ] || [ -z "$caps" ]; then
                echo "[zeek] FATAL: no effective capabilities (CapEff=$caps)." >&2
                echo "[zeek] Packet capture needs CAP_NET_RAW in the effective set." >&2
                echo "[zeek] Most likely cause: the container is running as a" >&2
                echo "[zeek] non-root uid, because Kubernetes DROPS added" >&2
                echo "[zeek] capabilities for non-root containers. The zeek" >&2
                echo "[zeek] container must run as uid 0 (see 32-zeek.yaml)." >&2
                echo "[zeek] Running as uid $(id -u)." >&2
                exit 1
              fi
              # hostPath volumes are NOT chowned by the kubelet (fsGroup does not
              # apply to hostPath), so the log directory may not be writable by the
              # uid this container runs as. Probe writability and say so plainly
              # rather than dying on an opaque permission error.
              if ! touch /zeek/logs/.writetest 2>/dev/null; then
                echo "[zeek] FATAL: /zeek/logs is not writable by uid $(id -u)." >&2
                echo "[zeek] Run this on the node:" >&2
                echo "[zeek]   install -d -m 2775 -g 10001 /var/lib/weirvern/zeek" >&2
                echo "[zeek]   chown -R 10001:10001 /var/lib/weirvern/zeek" >&2
                exit 1
              fi
              rm -f /zeek/logs/.writetest
              echo "[zeek] sniffing $IFACE (uid $(id -u), caps $caps), logs to /zeek/logs"
              # ROTATION: rotated logs are pruned by a CronJob in the worker image
              # (k8s/35-prune-cronjob.yaml), NOT here. This image has no python3 -- it
              # ships busybox/ash, perl and Zeek only -- so a Python pruner cannot run in
              # this container, and the worker cannot do it either because it mounts this
              # directory READ-ONLY to keep the ingester from mutating its own input.
              #
              # This container therefore only has to say whether the cap is set, because a
              # cap that nothing enforces is the failure mode worth shouting about.
              if [ -z "${ZEEK_MAX_MB:-}" ] || [ "${ZEEK_MAX_MB:-0}" = "0" ]; then
                echo "[zeek] WARNING: ZEEK_MAX_MB is unset, so rotated logs are NEVER" >&2
                echo "[zeek] WARNING: deleted and will fill the disk. Run: weirvern disk" >&2
              else
                echo "[zeek] rotation: cap ${ZEEK_MAX_MB} MB, enforced by the prune CronJob"
              fi
              # Bare script path => loaded as a script (see the note above).
              # ── CAPTURE FILTER (BPF) ────────────────────────────────────────
              #
              # A scanner sweeping the VLAN produces one-shot flow volume that is a picture of the
              # scanner rather than of the network: every address a "new" destination, every port a
              # "new" service. Dropping it at the SOCKET means Zeek never writes a log line for it,
              # which is cheaper than filtering later and is the only way to keep it out of the
              # files entirely.
              #
              # IT IS SEPARATE FROM THE INGEST-LAYER LIST, and deliberately so. This destroys the
              # record before it exists, so nothing can be re-examined afterwards -- fine for a
              # scanner, wrong for traffic you might want evidence about. `WEIRVERN_EXCLUDE_CIDRS`
              # is the ingest list (counted, keeps the row out of the store only), and THIS is
              # `WEIRVERN_CAPTURE_EXCLUDE_CIDRS`.
              #
              # UNVALIDATED EXPRESSIONS ARE THE DANGEROUS KIND: a bad one either fails Zeek at
              # startup OR matches nothing and yields an empty-but-healthy capture that reads as a
              # quiet network. So we build it here, print it, and let Zeek reject it loudly.
              BPF=""
              if [ -n "${WEIRVERN_CAPTURE_EXCLUDE_CIDRS:-}" ]; then
                for net in $(echo "$WEIRVERN_CAPTURE_EXCLUDE_CIDRS" | tr ',' ' '); do
                  case "$net" in
                    *:*)  # an IPv6 literal: a v4-style `net` term would match nothing.
                      echo "[zeek] FATAL: capture filter does not support IPv6 ('$net')." >&2
                      echo "[zeek] FATAL: use WEIRVERN_EXCLUDE_CIDRS for it instead, which" >&2
                      echo "[zeek] FATAL: filters at ingest and handles both families." >&2
                      exit 1 ;;
                    *.*/*)
                      # An explicit prefix: libpcap honours it, and the mask is visible in the
                      # compiled filter (verified: /24 emits `and #0xffffff00`).
                      BPF="$BPF or net $net" ;;
                    *.*)
                      # A bare address. MEASURED: libpcap infers /32 here -- the compiled
                      # bytecode for `net 203.0.113.5` is identical to `host 203.0.113.5`, with no
                      # mask applied. That inference is a libpcap convenience a reader cannot
                      # verify from this file, so it is written as /32 explicitly: same filter,
                      # self-evident expression.
                      BPF="$BPF or net $net/32" ;;
                    *)
                      echo "[zeek] FATAL: '$net' in WEIRVERN_CAPTURE_EXCLUDE_CIDRS is not a" >&2
                      echo "[zeek] FATAL: CIDR or address. Refusing to start with a filter that" >&2
                      echo "[zeek] FATAL: would silently match nothing." >&2
                      exit 1 ;;
                  esac
                done
                # `not (...)` so everything EXCEPT the listed networks is captured.
                BPF="not ( ${BPF# or } )"
                echo "[zeek] capture filter: $BPF"
              fi
              if [ -n "$BPF" ]; then
                exec zeek $IFARGS \
                     -C \
                     -f "$BPF" \
                     /zeek/site/weirvern-local.zeek \
                     Log::default_rotation_interval=1hr \
                     Log::default_logdir=/zeek/logs
              fi
              exec zeek $IFARGS \
                   -C \
                   /zeek/site/weirvern-local.zeek \
                   Log::default_rotation_interval=1hr \
                   Log::default_logdir=/zeek/logs
          env:
            - name: ZEEK_IFACE
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: ZEEK_IFACE
            - name: ZEEK_IFACES
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: ZEEK_IFACES
                  optional: true
            # THE CAPTURE EXCLUSION LIST, DECLARED HERE OR IT DOES NOTHING. The startup
            # script builds its BPF filter from this variable, and an UNDECLARED variable is
            # EMPTY at runtime -- so the filter would silently never apply while the manifest
            # appeared to configure it. Caught by tests/test_config_wiring.py, which is the
            # point of having it. Read from the ConfigMap so the value the GUI writes is the
            # one the sensor reads.
            - name: WEIRVERN_CAPTURE_EXCLUDE_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: WEIRVERN_CAPTURE_EXCLUDE_CIDRS
                  optional: true
            # Read only to WARN. The cap itself is enforced by the prune CronJob
            # (35-prune-cronjob.yaml), because this image has no python3 and the worker
            # mounts this directory read-only. But a cap that nothing enforces is the
            # failure worth shouting about, so the sensor says so at startup -- and for
            # that to work the variable must be declared here, not merely present in the
            # ConfigMap. (Verified: an undeclared ${VAR} is empty in this container even
            # when the ConfigMap has the key, which made the warning dead code.)
            - name: ZEEK_MAX_MB
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: ZEEK_MAX_MB
                  optional: true
            # MGMT_IFACE must be injected EXPLICITLY. The ConfigMap having the key is
            # not enough: without this the variable is empty inside the container, the
            # two-interface check silently falls through to default-route detection,
            # and an operator who deliberately set MGMT_IFACE would never be told that
            # ZEEK_IFACE points at the same NIC. Set it as optional so a ConfigMap
            # from an older release does not block the pod from starting.
            - name: MGMT_IFACE
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: MGMT_IFACE
                  optional: true
            # SENSOR_MODE tells the container HOW it is supposed to be capturing, so it
            # can state the blast radius in its own logs and refuse to start on a
            # contradiction (e.g. mode=siphon without the privileges that mode needs).
            # Optional so a ConfigMap from an earlier release does not block startup.
            - name: SENSOR_MODE
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: SENSOR_MODE
                  optional: true
          volumeMounts:
            - name: zeek-logs
              mountPath: /zeek/logs
            - name: zeek-site
              mountPath: /zeek/site
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # ── WHY THIS CONTAINER RUNS AS ROOT ──────────────────────────────
              #
              # VERIFIED ON A REAL CLUSTER, and it contradicts what this file used
              # to claim:
              #
              #   runAsUser=0      -> CapEff 0x2000 (CAP_NET_RAW) -> capture WORKS
              #   runAsUser=10001  -> CapEff 0x0    (nothing)      -> capture FAILS
              #
              # Kubernetes DROPS added capabilities for non-root containers. The
              # `add: ["NET_RAW"]` list only takes effect when the container runs
              # as uid 0. So an earlier version of this file ran Zeek as uid 10001
              # with `add: ["NET_RAW"]` and the grant was purely decorative: Zeek
              # started, tried to open the interface, and died with
              #
              #   fatal error: problem with interface eth0
              #   (pcap_error: socket: Operation not permitted (pcap_activate))
              #
              # A crash loop that looks like a bad ZEEK_IFACE but is actually a
              # capability that was never held. libpcap needs CAP_NET_RAW in the
              # EFFECTIVE set to open a raw socket, and there is no way to give a
              # non-root container one (it is not a matter of the PSA level, and
              # not specific to LXC -- `tcpdump` as root with cap_net_admin dropped
              # captures fine, which is what isolated this).
              #
              # So this is the ONE workload that runs as root, and the blast radius
              # is contained by the rest of this securityContext rather than by the
              # uid: capabilities dropped then only NET_RAW re-added, no privilege
              # escalation, seccomp RuntimeDefault, and no service-account token.
              # A packet sniffer that cannot capture packets has no value, so the
              # alternative (a non-root sensor) is not a real option here.
              #
              # NET_ADMIN is deliberately NOT granted: it would be needed to put the
              # interface into promiscuous mode, which must already be configured on
              # the mirror/SPAN port by whoever set the node up.
              add: ["NET_RAW"]
            # Root, for the capability to be effective. See above: this is not a
            # convenience, it is the only way NET_RAW survives into the container.
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              # Zeek grows with connection volume. Too low a limit shows up as
              # capture_loss in its own logs, which silently degrades detection.
              cpu: "2"
              memory: "2Gi"
          # No probe: Zeek has no HTTP endpoint, and a liveness probe that
          # restarts the sniffer on a slow period would drop packets. Its health
          # signal is capture_loss.log, which the worker ingests.
      volumes:
        - name: zeek-logs
          hostPath:
            path: /var/lib/weirvern/zeek
            type: DirectoryOrCreate
        - name: zeek-site
          # The Zeek site policy and config are GENERATED by kustomize from
          # zeek/weirvern-local.zeek (see
          # k8s/kustomization.yaml, configMapGenerator). There is exactly one
          # copy of each file — the repository copy — so the sensor cannot load
          # a stale policy that has drifted from what is under review.
          #
          # Apply with: kubectl apply -k k8s/
          configMap:
            name: zeek-site
            defaultMode: 0444
