# Zeek packet sensor — the second, independent view of the network.
#
# WHY A DAEMONSET WITH hostNetwork, and why this is the right model:
#
#   A packet sniffer can only see traffic on the interface it is attached to.
#   That is a property of the NODE, not of a pod — so the correct Kubernetes
#   abstraction is one Zeek per node (DaemonSet), attached to the host's network
#   namespace (hostNetwork: true) with the raw-socket capability (NET_RAW).
#   Running a sniffer inside a single host's network namespace has no
#   cluster-level equivalent and no answer for "which node?".
#
# NODE SELECTION: by default this runs on every node, which is wrong for most
# clusters (you rarely want Zeek sniffing the control plane). Restrict it with a
# label; the sensor node is the one carrying the mirrored/span traffic:
#
#     kubectl label node <node> weirvern.io/sensor-node=true
#
#   then uncomment the nodeSelector below. The default is therefore a DaemonSet
#   that will run everywhere until you constrain it — deliberately visible
#   rather than silently scoped to a node that may not exist.
#
# SECURITY POSTURE (this is the most privileged workload in the project):
#   * hostNetwork + NET_RAW are the minimum needed to capture packets. There is
#     no way to sniff without them.
#   * NET_ADMIN is NOT granted. It was needed in the single-host setup only for
#     optional interface tuning; here the interface must already exist and be
#     up, and Zeek does not reconfigure it.
#   * The container does not run as root (uid 10001) and drops all other
#     capabilities.
#   * The logs it writes are the only thing mounted from the host, and they are
#     written to a hostPath the worker reads.
#
# PRIVACY: Zeek's http.log and dns.log contain personal data (hostnames, URLs,
# user agents, and — with capture_password enabled — credentials). Keep
# capture_password OFF (it is off by default and Weirvern never enables it).
# See USAGE_POLICY.md before enabling additional log types.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zeek
  namespace: weirvern
  labels:
    app.kubernetes.io/name: zeek
    app.kubernetes.io/part-of: weirvern
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zeek
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeek
        app.kubernetes.io/part-of: weirvern
    spec:
      # Uncomment to confine the sensor to one node. See the note above.
      # nodeSelector:
      #   weirvern.io/sensor-node: "true"
      # TOLERATIONS: a DaemonSet runs on every node the selector matches, but a
      # node with a taint is skipped entirely UNLESS the pod tolerates it. This
      # matters most for the single-node case, which is the most common homelab
      # shape: on a one-node kubeadm cluster the only node carries
      # `node-role.kubernetes.io/control-plane:NoSchedule`, so without the
      # toleration below the Zeek pod stays Pending forever and packet capture
      # never starts — while everything else looks healthy.
      #
      # Left commented out deliberately: tolerating the control-plane taint means
      # a PRIVILEGED packet sniffer may run on control-plane nodes in a
      # multi-node cluster. That is a placement decision, not a default.
      # Uncomment for a single-node cluster; k3s/k0s usually need nothing here
      # because they do not taint the control plane by default.
      # tolerations:
      #   - key: node-role.kubernetes.io/control-plane
      #     operator: Exists
      #     effect: NoSchedule
      hostNetwork: true
      # Zeek writes to a hostPath, and DNS resolution inside Zeek benefits from
      # the node's resolver rather than the cluster's, which would send every
      # reverse lookup to CoreDNS.
      dnsPolicy: ClusterFirstWithHostNet
      # The pod must survive eviction pressure on a busy sensor node: capture
      # loss makes the anomaly baseline wrong, which is worse than the memory it
      # costs to keep it resident.
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: zeek
          image: zeek/zeek:lts
          # Run Zeek in the foreground on the chosen interface. `-C` disables
          # checksum validation, which is required when the traffic arrives via
          # a mirror/SPAN port where the NIC has already validated it.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              IFACE="${ZEEK_IFACE:-eth0}"
              if ! ip link show "$IFACE" >/dev/null 2>&1; then
                echo "[zeek] FATAL: interface '$IFACE' does not exist on this node." >&2
                echo "[zeek] Set ZEEK_IFACE in the weirvern-env ConfigMap to a real" >&2
                echo "[zeek] interface (the mirror/span port). Available interfaces:" >&2
                ip -o link show | awk -F': ' '{print "  " $2}' >&2
                exit 1
              fi
              echo "[zeek] sniffing $IFACE, writing logs to /zeek/logs"
              exec zeek -i "$IFACE" \
                   -C \
                   SitePolicyFile=/zeek/site/weirvern-local.zeek \
                   Log::default_rotation_interval=1hr \
                   Log::default_logdir=/zeek/logs
          env:
            - name: ZEEK_IFACE
              valueFrom:
                configMapKeyRef:
                  name: weirvern-env
                  key: ZEEK_IFACE
          volumeMounts:
            - name: zeek-logs
              mountPath: /zeek/logs
            - name: zeek-site
              mountPath: /zeek/site
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # The two capabilities packet capture genuinely requires.
              add: ["NET_RAW", "NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              # Zeek grows with connection volume. Too low a limit shows up as
              # capture_loss in its own logs, which silently degrades detection.
              cpu: "2"
              memory: "2Gi"
          # No probe: Zeek has no HTTP endpoint, and a liveness probe that
          # restarts the sniffer on a slow period would drop packets. Its health
          # signal is capture_loss.log, which the worker ingests.
      volumes:
        - name: zeek-logs
          hostPath:
            path: /var/lib/weirvern/zeek
            type: DirectoryOrCreate
        - name: zeek-site
          # The Zeek site policy and config are GENERATED by kustomize from
          # zeek/weirvern-local.zeek and zeek/zeekctl.cfg (see
          # k8s/kustomization.yaml, configMapGenerator). There is exactly one
          # copy of each file — the repository copy — so the sensor cannot load
          # a stale policy that has drifted from what is under review.
          #
          # Apply with: kubectl apply -k k8s/
          configMap:
            name: zeek-site
            defaultMode: 0444
