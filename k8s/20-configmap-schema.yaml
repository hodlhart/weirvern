# Schema delivery.
#
# The SQL in weirvern/schema/ is the single source of truth for the schema and
# is applied by `weirvern init-db` (see 50-schema-job.yaml), which runs the
# SAME code path a local `weirvern init-db` uses — weirvern.db.apply_schema.
#
# It lives INSIDE the Python package (weirvern/schema/001_weirvern.sql) on
# purpose, and is declared in pyproject.toml's package-data, so it is present in
# an installed wheel. That detail is load-bearing: the schema Job runs
# `weirvern init-db` from the container image, and a repo-level schema
# directory is absent from a real (non-editable) install. Verified failure mode:
# the path resolved outside the package, zero files were applied, and the job
# reported success.
#
# WHY NOT a ConfigMap of the .sql file:
#   Baking the schema into a ConfigMap would create a second copy that can drift
#   from the packaged one, and the manifest would have to be regenerated by hand
#   on every schema change. Instead the schema Job runs the application's own
#   image, which already contains the schema, so there is exactly one copy and it
#   is versioned with the code that uses it.
#
# This file is kept as an explicit marker of that decision: if you see a
# generated ConfigMap of SQL here, the duplication has regressed.
#
# The Job is idempotent — every statement is CREATE ... IF NOT EXISTS — so it is
# safe to re-run and safe to run concurrently with a live worker.
apiVersion: v1
kind: ConfigMap
metadata:
  name: weirvern-schema-notes
  namespace: weirvern
data:
  README: |
    Schema is applied by the schema Job (50-schema-job.yaml) using the
    application image, so weirvern/schema/*.sql stays the single source of
    truth. Do not inline a copy of the SQL here.
