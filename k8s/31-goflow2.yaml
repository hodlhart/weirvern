# Flow collector (NetFlow v5/v9/IPFIX + sFlow) — the primary sensor.
#
# NODE-PINNED, FILE-BASED, SINGLE REPLICA. Read this before changing anything:
#
#   goflow2 writes JSONL to a hostPath (/var/lib/weirvern/flows) and the worker
#   TAILS that file. So the writer and the reader must be on the SAME NODE. That
#   is enforced with a nodeSelector on a node label, not left to scheduling luck
#   — if the two land on different nodes the worker silently reads an empty file
#   and the system looks healthy while detecting nothing.
#
#   Label the sensor node once:
#       kubectl label node <node> weirvern.io/sensor-node=true
#
# This is the homelab-correct shape and it is also an honest statement of the
# limitation: file-tail ingest does not horizontally scale. To run multiple
# collector nodes, each needs its own worker, or the transport must change to a
# broker (see k8s/README.md, "Scaling and limits").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goflow2
  namespace: weirvern
  labels:
    app.kubernetes.io/name: goflow2
    app.kubernetes.io/part-of: weirvern
spec:
  replicas: 1
  # `Recreate` avoids two collectors appending to the same file during an
  # update, which interleaves records and corrupts the tailer's offset tracking.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: goflow2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goflow2
        app.kubernetes.io/part-of: weirvern
    spec:
      nodeSelector:
        weirvern.io/sensor-node: "true"
      # ── hostNetwork, for the same reason Zeek has it ────────────────────────
      #
      # Without this the collector runs in the cluster network and its UDP socket
      # is reachable ONLY through the Service's NodePort DNAT. That works for a
      # correctly-configured exporter, but it fails silently and confusingly when
      # an exporter targets the CONTAINER port (2055) instead of the NodePort
      # (32055): the packets arrive at the node, match nothing, and are dropped.
      # A real router was observed doing exactly this -- sending 300-byte NetFlow
      # to 203.0.113.159:2055 while the listener was at 32055 -- with the result
      # that the database stayed empty and NOTHING logged an error, because from
      # the collector's point of view no packets were ever sent.
      #
      # With hostNetwork the container binds 2055/6343 in the node's own network
      # namespace, so BOTH the conventional port and the NodePort work. For a
      # collector that receives unsolicited UDP from LAN devices, that is the
      # difference between a working sensor and an invisible one.
      hostNetwork: true
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: goflow2
          image: netsampler/goflow2:v2.2.6@sha256:b930e69d1bc7bd765da5b45d12f04edd10970c310b33ba44fd12a07a870da8e6
          env:
            # THE NODE'S OWN ADDRESS, so an external router can still export to this node on
            # 2055 (the NodePort DNATs to podIP:2055, which with hostNetwork is the node IP).
            # Kubernetes expands $(NODE_IP) in args because it is defined here.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          args:
            # ── ONE PORT, ONE ADDRESS PER NIC (2026-11-18) ────────────────────────────────────
            # Two listeners may share a port when they bind different addresses, and Linux
            # routes all of 127.0.0.0/8 locally. eth1's exports go to 127.0.0.1:2055; eth2's go
            # to 127.0.0.2:2055 in the SECOND container below, which writes its own file -- so
            # the port in the docs, the firewall and every exporter stays 2055, and the FILE is
            # what names the NIC. The wildcard bind had to go: it would swallow 127.0.0.2.
            #
            # ONE NETFLOW LISTENER PER PROCESS. goflow2 v2.2.6 PANICS with two netflow listeners
            # in one process ("pattern /templates conflicts with /templates", measured on the
            # first apply), so the node's own address -- where a LAN router exports -- is a third
            # container, not a second URI here. sflow rides along: its scheme registers no
            # template handler, which is why netflow+sflow worked and netflow+netflow did not.
            - -listen
            - netflow://127.0.0.1:2055,sflow://:6343
            - -format
            - json
            - -transport
            - file
            - -transport.file
            - /data/flows.jsonl
          ports:
            - name: netflow
              containerPort: 2055
              protocol: UDP
            - name: sflow
              containerPort: 6343
              protocol: UDP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: flow-data
              mountPath: /data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 100
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 20
        # ── THE SECOND NIC'S COLLECTOR ──────────────────────────────────────────────────────────
        # Same image, same port, one address over: 127.0.0.2:2055, its own file. The worker's
        # ingester tails BOTH files and tags each record with the interface the file belongs to.
        # Nothing here is a guess about the packets: softflowd cannot report an interface when it
        # reads a pcap (measured four ways), so the separation happens at the collector, where it
        # is a fact about which socket received the export.
        - name: goflow2-eth2
          image: netsampler/goflow2:v2.2.6@sha256:b930e69d1bc7bd765da5b45d12f04edd10970c310b33ba44fd12a07a870da8e6
          args:
            - -listen
            - netflow://127.0.0.2:2055
            - -addr
            - :8081
            - -format
            - json
            - -transport
            - file
            - -transport.file
            - /data/flows-eth2.jsonl
          volumeMounts:
            - name: flow-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 100
          readinessProbe:
            httpGet: {path: /metrics, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /metrics, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 20
        # ── WHAT A LAN ROUTER REACHES (the node's own address, port 2055) ───────────────────────
        # The Service DNATs to podIP:2055, which with hostNetwork is the node's address. Records
        # from here are NOT attributed to a NIC, and the ingester leaves in_iface empty for them:
        # a router export says nothing about which interface this sensor captured it on.
        - name: goflow2-external
          image: netsampler/goflow2:v2.2.6@sha256:b930e69d1bc7bd765da5b45d12f04edd10970c310b33ba44fd12a07a870da8e6
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          args:
            - -listen
            - netflow://$(NODE_IP):2055
            - -addr
            - :8082
            - -format
            - json
            - -transport
            - file
            - -transport.file
            - /data/flows-external.jsonl
          volumeMounts:
            - name: flow-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 100
          readinessProbe:
            httpGet: {path: /metrics, port: 8082}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /metrics, port: 8082}
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: flow-data
          hostPath:
            path: /var/lib/weirvern/flows
            # Created by the cluster if absent. The kubelet makes it owned by
            # root; the worker only READS here, and goflow2 writes as its own
            # uid, so make the directory group-writable on the node:
            #   install -d -m 0775 -g 10001 /var/lib/weirvern/flows
            type: DirectoryOrCreate
---
# NetFlow/sFlow intake from the LAN.
#
# `externalTrafficPolicy: Local` is REQUIRED, not a tuning choice: the collector
# runs on one specific node, and with the default policy the kube-proxy on any
# other node may accept the UDP packets and forward them to the wrong place (or
# drop them). Local pins the intake to the node actually running goflow2.
apiVersion: v1
kind: Service
metadata:
  name: goflow2
  namespace: weirvern
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: goflow2
  ports:
    - name: netflow
      protocol: UDP
      port: 2055
      targetPort: netflow
      nodePort: 32055
    - name: sflow
      protocol: UDP
      port: 6343
      targetPort: sflow
      nodePort: 32063
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: metrics
