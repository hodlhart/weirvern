# Persistent storage.
#
# WHAT IS ON A PVC vs A hostPath, and why:
#
#   PVC  — data that must survive a pod moving to another node: the trained model
#          artifacts, and ClickHouse's data directory.
#
#   hostPath — data that is inherently node-local: the flow JSONL that goflow2
#          writes and the Zeek logs. These are produced by *node-level sensors*
#          (a packet sniffer sees only its own node's traffic), so a network
#          filesystem would add no portability and real latency. The reader (the
#          worker) is pinned to the same node via nodeAffinity; see 33-worker.yaml.
#
# ── THE STORAGE CLASS ────────────────────────────────────────────────────────
# `local-path` is the default dynamic provisioner on **k3s**. It is NOT a k0s
# default: k0s ships no provisioner, and its documentation lists third-party CSI
# drivers (Rook-Ceph, Longhorn, ...) instead. On a bare k0s cluster both claims
# below stay Pending forever and ClickHouse never starts.
#
# The value appears in THREE places, not one:
#   * here, twice (models and, historically, clickhouse-data)
#   * k8s/30-clickhouse.yaml, in the StatefulSet's volumeClaimTemplate
#
# Change all three together, or set the value to "" to use the cluster's default
# StorageClass (which is what a cluster with exactly one provisioner wants).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: weirvern
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # Trained model artifacts are small (a few MB); this is the working set for
      # retrains plus the version history that makes rollback possible.
      storage: 5Gi
---
# NOTE: there is deliberately NO `clickhouse-data` PVC here.
#
# There used to be, and it was a trap: it duplicated the StatefulSet's own
# `volumeClaimTemplates` entry of the same name (k8s/30-clickhouse.yaml), so it
# was mounted by nothing while still requesting 50Gi — on a cluster with a
# default StorageClass it binds a real volume that nothing ever writes to, and an
# operator reading this file reasonably concludes it is the database's volume.
#
# ClickHouse's storage is declared where it is actually used, as a
# volumeClaimTemplate on the StatefulSet, so it is named after the pod that owns
# it and is resized in one obvious place.
